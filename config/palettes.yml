# Palettes offered by ./style.sh. Each is the same seven keys per mode
# that config/site.yml takes, so choosing one here and pasting one in by
# hand are the same act -- the wizard copies these values into your
# config and nothing about the palette lives on afterwards.
#
# Add your own by adding an entry: the wizard lists whatever is in this
# file, in this order. Names are looked up as style.palette.<key> in
# locales/<lang>.yml and fall back to the label here, so a palette you
# add needs no translation to work.
#
# The four below are the ones from the gallery on blogsh.app. Their
# light modes are exactly what that page shows; the dark modes are new,
# since the gallery only ever had light homepages.

# The palette the engine ships with. Twitter-era blue on a
#   barely-tinted page.
default:
  label: "Default blue"
  light:
    bg: "#f5f8fa"
    text: "#444a5a"
    meta_text: "#657784"
    accent: "#1da1f2"
    nav_bg: "#eaf5fd"
    border: "#e1e8ed"
    pill_bg: "#d6ecfc"
  dark:
    bg: "#111111"
    text: "#ffffff"
    meta_text: "#6a7f8c"
    accent: "#4ab3f4"
    nav_bg: "#192734"
    border: "#263340"
    pill_bg: "#16324a"

# Cream and brown with a terracotta accent -- a paper-ish page
#   rather than a screen-ish one.
warm:
  label: "Warm"
  light:
    bg: "#faf6f0"
    text: "#4a4237"
    meta_text: "#8a7a68"
    accent: "#c0563b"
    nav_bg: "#f3ead9"
    border: "#ece7df"
    pill_bg: "#eedbc9"
  dark:
    bg: "#111111"
    text: "#ffffff"
    meta_text: "#a2938a"
    accent: "#e2795c"
    nav_bg: "#2a1c17"
    border: "#3f2a22"
    pill_bg: "#3a251e"

# No hue at all: the accent is a darker grey, so links are told
#   apart by weight and underline rather than colour.
mono:
  label: "Monochrome"
  light:
    bg: "#f7f7f7"
    text: "#1f1f1f"
    meta_text: "#777777"
    accent: "#444444"
    nav_bg: "#ececec"
    border: "#e7e7e7"
    pill_bg: "#dbdbdb"
  dark:
    bg: "#111111"
    text: "#ffffff"
    meta_text: "#b0b0b0"
    accent: "#8c8c8c"
    nav_bg: "#292929"
    border: "#373737"
    pill_bg: "#313131"

# Black on white, hypertext blue, and borders instead of
#   tinted surfaces. The dark mode is its mirror: true black.
contrast:
  label: "High contrast"
  light:
    bg: "#ffffff"
    text: "#000000"
    meta_text: "#333333"
    accent: "#0000d6"
    nav_bg: "#ffffff"
    border: "#e6e6e6"
    pill_bg: "#e6e6fb"
  dark:
    bg: "#000000"
    text: "#ffffff"
    meta_text: "#b3b3b3"
    accent: "#6b9bff"
    nav_bg: "#000000"
    border: "#333333"
    pill_bg: "#1c2c52"
