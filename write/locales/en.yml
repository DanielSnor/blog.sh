# locales/en.yml -- default/fallback locale. Every key here MUST exist:
# a locale may be partial and anything missing is read from this file.
#
# `error` mirrors the codes scripts/receive.sh returns. The server never
# sends translated text -- it sends a code, and the app says it in the
# reader's language. That is why no locale file has to be installed next
# to blog.sh.

error:
  no_incoming: "That installation has no incoming/ directory, so there is nowhere to put the post."
  no_engine: "No blog.sh found at that path."
  no_tmp: "The server could not open a temporary directory."
  bad_base64: "The bundle arrived damaged. Send it again."
  empty_input: "Nothing arrived. The bundle was empty."
  too_large: "The bundle is bigger than the server accepts. Remove a photo or send fewer at once."
  missing_markdown: "There is no text in the bundle -- only pictures came through."
  write_failed: "The server refused to write the files. Most often this is permissions on incoming/."
  engine_failed: "The server took the files but the blog did not answer as it should. What it said is below; check the installation before sending again."
  timeout: "The connection went quiet for too long and the server dropped it. Send it again."
  bad_limit: "The server's size limit is set to something that is not a number. Fix BLOGSH_MAX_MB on the server."
  truncated: "The delivery stopped before its end -- the connection broke, or the closing dot never came. Send it again."
  bad_name: "The server refused a filename: it carried a path, began with a dot, was empty or too long, or held a control character."
  bad_slug: "The request to publish did not carry a usable slug, so nothing was published. A slug is the address a post is filed under: lower case, digits and dashes."
  empty_file: "A file arrived with nothing in it."
  missing_images: "The text names a picture that did not arrive. Add it again and send once more."
  bad_markdown: "The blog could not read the text."
  no_cd: "The server could not enter the installation directory."
  no_reply: "The server said nothing. It may still have saved the post -- check the blog before sending it again."

  bad_reference: "A picture must be referenced by name alone, without a path. These have one:"
  name_taken: "Something of that name in incoming/ is not an ordinary file -- a folder, or a link. Nothing was replaced. Rename the picture, or clear that name on the server."

