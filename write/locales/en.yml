# locales/en.yml -- default/fallback locale. Every key here MUST exist:
# a locale may be partial and anything missing is read from this file.
#
# `error` mirrors the codes server/receive.sh returns. The server never
# sends translated text -- it sends a code, and the app says it in the
# reader's language. That is why no locale file has to be installed next
# to blog.sh.

error:
  no_install: "The server does not know which blog to write to. Check the path in the shortcut."
  no_incoming: "That installation has no incoming/ directory, so there is nowhere to put the post."
  no_engine: "No blog.sh found at that path."
  engine_too_old: "This blog.sh is too old to accept a post as a file. Update it and try again."
  no_tmp: "The server could not open a temporary directory."
  bad_base64: "The bundle arrived damaged. Send it again."
  empty_input: "Nothing arrived. The bundle was empty."
  too_large: "The bundle is bigger than the server accepts. Remove a photo or send fewer at once."
  not_a_zip: "The bundle is not a readable archive. Send it again."
  missing_markdown: "There is no text in the bundle -- only pictures came through."
  many_markdown: "The bundle holds more than one text. One post at a time."
  write_failed: "The server refused to write the files. Most often this is permissions on incoming/."
  no_cd: "The server could not enter the installation directory."
  add_failed: "The blog refused the post."
  no_reply: "The server said nothing. It may still have saved the post -- check the blog before sending it again."
  no_docker: "The server cannot reach its container tooling. Something changed in how the blog is hosted."
  no_target: "The relay does not know which container to enter. Set RELAY_NAME or RELAY_IMAGE."
  no_container: "The blog's container is not running. It may be starting up -- try again in a moment."

  bad_reference: "A picture must be referenced by name alone, without a path. These have one:"
  no_unzip: "The server has no unzip. It cannot open the bundle."
  unpacks_too_large: "The bundle unpacks to more than the server accepts."
  name_taken: "A post of that name is already being written. Rename it or try again."
  busy: "The blog is busy with something else. Try again in a moment."
  bad_entry: "The bundle holds something that is not an ordinary file. Send it again from the app."
deploy:
  done: "Published to the site."
  pending: "Saved. The site rebuilds within a quarter of an hour."

