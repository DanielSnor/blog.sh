  alt_missing: "No description yet"
  used_in_text: "Used in the text"
  unused_image: "Not mentioned in the text -- it will be uploaded but nothing will show it."
  send: "Send to blog"
  sending: "Sending…"
  discard: "Discard"
  discard_confirm: "Discard everything?"
  discard_note: "Title, text, tags and pictures will be gone."
  discarded: "Discarded."
  saved_locally: "Kept on this device"
