<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>blog.sh</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6e70">
<!-- Nobody is meant to arrive here from a search: it is the desk, not the
     shop. It holds nothing private, so this is tidiness rather than a
     defence -- the only key it needs lives on the phone, in the shortcut. -->
<meta name="robots" content="noindex">
<style>
/* System fonts on purpose: this is used on a train. A webfont that has to
   be fetched is a blank screen exactly where the app is meant to work. */
:root{
  --bg:#fbfbfa; --surface:#ffffff; --sunk:#f2f3f4;
  --text:#1a1c1e; --meta:#62666b; --border:#e2e4e6;
  --accent:#0f6e70; --on-accent:#ffffff; --accent-soft:#e3f0f0;
  --warn:#8a5a12; --bad:#a3341f;
  --radius:8px;
  --shadow:0 1px 2px rgba(26,28,30,.06), 0 8px 24px -18px rgba(26,28,30,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181a; --surface:#1f2224; --sunk:#26292c;
    --text:#e4e6e8; --meta:#9aa0a6; --border:#2f3336;
    --accent:#5cb8ba; --on-accent:#08292a; --accent-soft:#173032;
    --warn:#d8a657; --bad:#e8836b;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#16181a; --surface:#1f2224; --sunk:#26292c;
  --text:#e4e6e8; --meta:#9aa0a6; --border:#2f3336;
  --accent:#5cb8ba; --on-accent:#08292a; --accent-soft:#173032;
  --warn:#d8a657; --bad:#e8836b;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:400 16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;
  /* room for the sticky bar, plus the home indicator on a phone */
  padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}
.wrap{max-width:42rem;margin:0 auto;padding:1rem 1rem 0}

header{display:flex;align-items:baseline;gap:.5rem;padding:.5rem 0 1rem}
header h1{font-size:1.1rem;margin:0;letter-spacing:-.01em}
header .sub{color:var(--meta);font-size:.9rem}
header .kept{margin-left:auto;color:var(--meta);font-size:.75rem}

.field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.1rem}
.field > label{font-size:.8rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;
  color:var(--meta)}
.field .hint{color:var(--meta);font-size:.82rem;line-height:1.4}
input[type=text],textarea{width:100%;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:.7rem .8rem;
  font:inherit;font-size:1rem}
textarea{resize:vertical;line-height:1.6}
#body{min-height:14rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* pictures */
.shots{display:flex;flex-direction:column;gap:.6rem}
.shot{display:grid;grid-template-columns:4.5rem 1fr;gap:.6rem;padding:.55rem;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.shot img{width:4.5rem;height:4.5rem;object-fit:cover;border-radius:5px;background:var(--sunk)}
.shot .side{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.shot .name{font-size:.75rem;color:var(--meta);word-break:break-all;
  display:flex;gap:.4rem;align-items:baseline;flex-wrap:wrap}
.shot textarea{min-height:3rem;font-size:.9rem;background:var(--sunk)}
.shot .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.chip{font-size:.7rem;padding:.12rem .4rem;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:transparent;color:var(--warn);border:1px solid currentColor}
.link{background:none;border:none;padding:0;color:var(--accent);font:inherit;
  font-size:.8rem;text-decoration:underline;cursor:pointer}
/* The insert is the picture's primary action, so it is a real button --
   small, but a full tap target. */
button.btn.small{font-size:.85rem;padding:.5rem .8rem;flex:0 0 auto}
/* A destructive control looks inactive until it is armed: no border, muted
   text, pushed to the far right so a thumb heading for Insert does not
   pass over it. Armed, it becomes a warning-coloured button. */
.remove,button.btn.ghost[data-arm=""],button.btn.ghost:not([data-arm]){
  margin-left:auto;background:none;border:1px solid transparent;color:var(--meta);
  font:inherit;font-size:.85rem;padding:.5rem .8rem;border-radius:8px;cursor:pointer}
.remove[data-arm="yes"],button.btn.ghost[data-arm="yes"]{
  color:#fff;background:var(--warn);border-color:var(--warn)}

button.btn{font:inherit;font-weight:600;font-size:.95rem;padding:.8rem 1.1rem;
  border-radius:var(--radius);border:1px solid var(--accent);background:var(--accent);
  color:var(--on-accent);cursor:pointer}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.btn.ghost{background:transparent;color:var(--text);border-color:var(--border)}
button.btn.ghost:hover{border-color:var(--accent)}

details.server{margin-bottom:1.1rem;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.6rem .8rem}
details.server summary{cursor:pointer;font-size:.85rem;font-weight:600;color:var(--meta)}
details.server .field{margin:.8rem 0 .2rem}

/* the bar: thumb reach on a phone, so the main action sits at the bottom */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
  border-top:1px solid var(--border);box-shadow:var(--shadow);
  padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom))}
.bar .inner{max-width:42rem;margin:0 auto;display:flex;gap:.6rem;align-items:center}
.bar .btn{flex:1}
.bar .btn.ghost{flex:0 0 auto}
.say{font-size:.85rem;color:var(--meta);min-height:1.2em;margin:.5rem 0 0;text-align:center}
.say[data-kind="bad"]{color:var(--bad)}
.say[data-kind="good"]{color:var(--accent)}

.result{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:1rem;margin-bottom:1.1rem}
.result h2{font-size:.95rem;margin:0 0 .5rem}
.result ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--meta);font-size:.88rem}
.result a{color:var(--accent)}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-t="app.name">blog.sh</h1>
    <span class="sub" data-t="app.subtitle"></span>
    <span class="kept" id="kept" hidden></span>
  </header>

  <div class="result" id="result" hidden></div>

  <div class="field">
    <label for="title" data-t="app.title_label"></label>
    <input type="text" id="title" autocomplete="off">
    <span class="hint" data-t="app.title_hint"></span>
  </div>

  <div class="field">
    <label for="body" data-t="app.body_label"></label>
    <textarea id="body"></textarea>
    <span class="hint" data-t="app.body_hint"></span>
  </div>

  <div class="field">
    <label for="tags" data-t="app.tags_label"></label>
    <input type="text" id="tags" autocomplete="off">
    <span class="hint" data-t="app.tags_hint"></span>
  </div>

  <div class="field">
    <label data-t="app.images_label"></label>
    <div class="shots" id="shots"></div>
    <div class="row" style="margin-top:.5rem">
      <button type="button" class="btn ghost" id="pick" data-t="app.add_image"></button>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
  </div>

</div>

<div class="bar">
  <div class="inner">
    <button type="button" class="btn" id="send" data-t="app.send"></button>
    <button type="button" class="btn ghost" id="discard" data-t="app.discard"></button>
  </div>
  <p class="say" id="say"></p>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
