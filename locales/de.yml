  # Wort, das sagt, um welche Art Liste es sich handelt -- es bleibt für
  # Screenreader erhalten und ist standardmäßig unsichtbar (siehe
  # .listing-heading__kind in site.css).
  kind: "Schlagwort"
  title: "Schlagwort: %{name} – %{short_name}"
  description: "Beiträge mit dem Schlagwort %{name} auf der persönlichen Seite von %{author}."

series:
  kind: "Serie"
  title: "%{name} – %{short_name}"
  description: "Die Serie %{name} auf der persönlichen Seite von %{author}, in Lesereihenfolge."

type:
  text: "Text"
  quote: "Zitate"
  chat: "Chat"
  image: "Bilder"
  video: "Video"
  audio: "Audio"
  link: "Links"
  document: "Dokumente"
