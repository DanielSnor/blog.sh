  buffer_prompt: "[r] in diesen Editor holen  [d] verwerfen  [c] ohne ihn weitermachen: "
  buffer_prompt_foreign: "[d] verwerfen  [c] ohne ihn weitermachen: "
  buffer_restored: "Wiederhergestellt -- der Editor öffnet sich mit diesem Text."
  buffer_discarded: "Verworfen."
  buffer_kept_for_now: "Bleibt in %{path} -- sobald du in dieser Sitzung etwas schreibst, wird er ersetzt."
