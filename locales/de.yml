  e_base_url_slash: "Entferne den Schrägstrich am Ende, sonst stehen in erzeugten Links zwei."

  section_network_intro: "blog.sh hat keine eigene Kommentarfunktion. Stattdessen wird jeder neue Beitrag auf deinem Konto in einem sozialen Netzwerk angekündigt, und Antworten auf diese Ankündigung erscheinen unter dem Beitrag als seine Kommentare. Du wählst also das Netzwerk, auf dem du schon ein Konto hast (oder eines anlegst)."
