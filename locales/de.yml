  token_invalid_bluesky_fix: "Erstelle in Bluesky ein neues App-Passwort (Einstellungen -> Privatsphäre und Sicherheit -> App-Passwörter) und trage es in env.sh als BLUESKY_APP_PASSWORD ein."
  token_unchecked: "Der Token konnte gegen %{instance} nicht geprüft werden (%{code})."
