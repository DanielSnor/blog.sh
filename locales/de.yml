    ssg_slug_collisions: "%{count} Adresse(n) wurden von mehr als einer Datei beansprucht -- ein Hugo-Baum, der sowohl den flachen Beitrag als auch das daraus gewachsene Page Bundle behalten hat, oder derselbe Artikel zweimal abgelegt. Alle wurden importiert, die späteren mit \"-2\" am Ende, es ging also nichts verloren; sieh dir diese Paare an und lösche, was du nicht behalten willst."
    ssg_author_dropped: "%{count} Beitrag/Beiträge nennen im Front Matter einen Autor. Diese Engine ist bewusst für eine Person gebaut und hat kein Feld dafür, der Name kam also nicht mit -- wenn im Archiv Texte anderer Leute liegen, nenne sie vor dem Veröffentlichen im Text."
    substack_paid: "%{count} Beitrag/Beiträge waren auf Substack nur für Abonnenten -- vollständig importiert (der Export gehört dir) und mit \"substack-paid\" getaggt, damit du sie vor dem Veröffentlichen findest."
    facebook_crossposts: "%{count} Beitrag/Beiträge waren Crossposts von anderen Plattformen (Twitter, Posterous, …) -- übersprungen, damit sie die eigenen Importe jener Plattformen nicht doppeln. FACEBOOK_CROSSPOSTS=1 nimmt sie mit."
    facebook_untouched: "Der Export enthält auch Dinge außerhalb der Chronik, die dieser Import nicht übernimmt: nicht zugeordnete Fotos (%{photos}), Alben (%{albums}) und Videos (%{videos}). Sie bleiben im heruntergeladenen Export -- ein Album ist kein Beitrag, und ein Beitrag je Foto würde die Chronik zuschütten."
    feed_ampersands_escaped: "%{count} allein stehende \"&\"-Zeichen machten diese Datei zu ungültigem XML -- maskiert, damit sie überhaupt gelesen werden konnte. Text in CDATA, wo die Beitragstexte stehen, blieb genau so, wie er exportiert wurde."
    feed_controls_dropped: "%{count} von XML nicht erlaubte(s) Steuerzeichen wurde(n) entfernt, damit die Datei gelesen werden konnte."
    feed_unmapped: "%{count} Beitrag/Beiträge hatten keine brauchbare Originaladresse (nackte „?p=123“-Permalinks tragen ihre Identität im Query-String) -- ohne Weiterleitung importiert."
    feed_unmapped_pages: "%{count} Seite(n) hatten keine brauchbare Originaladresse (nackte „?page_id=12“-Permalinks tragen ihre Identität im Query-String) -- ohne Weiterleitung importiert."
    feed_pages_home: "%{count} Seite(n) liegen bereits auf der Adresse, die sie auf der alten Website hatten, und brauchen keine Weiterleitung -- beim Umzug auf dieselbe Domain funktionieren ihre Links unverändert weiter."
    feed_pages_reserved: "%{count} Seite(n) kamen auf Adressen an, die diese Engine für sich selbst nutzt (%{paths}) -- der Build stellt sie erst online, wenn sie umbenannt sind; trage sie so nicht unter `nav:` ein."
    feed_dropped: "Inhalt, für den das Blockschema keine Form hat, wurde aus den Beitragstexten entfernt: %{listed}. Meist sind das Embeds und Formulare -- braucht ein Beitrag sein Video, setze den Link von Hand zurück."
    duplicate_ids: "%{count} Einträge der Quelle trugen eine id, die ein anderer Eintrag schon benutzt hatte. Jeder wird als eigener Beitrag geschrieben statt über den ersten -- sieh sie dir an und lösche den, der die Kopie ist."
    feed_linked_images: "%{count} Bild(er) waren in einen Link gehüllt, den ein Bildblock nicht tragen kann -- die Bilder kamen an, die Adressen, auf die sie zeigten, nicht."
    ghost_scheduled: "%{count} Beitrag/Beiträge waren in Ghost geplant -- als Entwürfe importiert; plane sie hier, wenn du so weit bist."
    livejournal_nonpublic: "%{count} Eintrag/Einträge waren nur für Freunde oder privat -- als Entwürfe importiert, öffentlich waren sie nie."
    medium_responses: "%{count} Beitrag/Beiträge sahen aus wie Antworten unter fremden Artikeln -- zur Durchsicht als Entwürfe importiert."
    medium_untagged: "%{count} veröffentlichte(r) Beitrag/Beiträge kamen ohne Tags."
    movabletype_comments: "%{count} Kommentar(e)"
    movabletype_pings: "%{count} Trackback(s)"
    movabletype_and: " und "
    movabletype_left_behind: "Der Export trug auch %{parts} -- ein statisches Archiv hat dafür keinen Platz, sie blieben zurück."
    movabletype_textile: "%{count} Beitrag/Beiträge sind in Textile geschrieben (CONVERT BREAKS: textile_2). Die Absätze stimmen, aber Textiles eigene Auszeichnung -- h2., \"text\":url, *fett* -- kam so an, wie sie geschrieben war."
    podcast_media_size: "Die Episoden summieren sich auf ~%{size} zum Herunterladen und Hosten."
    threads_replies: "%{count} Antwort(en) auf fremde Threads übersprungen -- ein Archiv hält deine eigenständigen Beiträge."
    threads_html_replies: "Die HTML-Seite markiert Antworten nicht, dieser Import konnte sie also nicht unterscheiden -- ein Konto mit Antworten importiert man besser aus dem JSON, das sie markiert und überspringt."
    tumblr_unmapped: "%{count} Beitrag/Beiträge hatten keine brauchbare Originaladresse -- ohne Weiterleitung importiert."
    wayback_pack_detected: "%{platform}-Markup erkannt und die Seiten mit dessen Leser gelesen."
    wayback_window: "Nur Schnappschüsse aus %{range} wurden gelesen -- das angefragte Fenster. Beiträge, die der Feed bis dahin nicht mehr trug, fehlen in diesem Lauf."
    wayback_snapshots: "%{count} Feed-Schnappschuss/Schnappschüsse aus der Wayback Machine gelesen."
    wayback_unreadable: "%{count} Schnappschuss/Schnappschüsse waren keine lesbaren Feeds -- übersprungen."
    wayback_unanswered_captures: "Bei %{count} Schnappschuss/Schnappschüssen hörte das Archiv auf zu antworten -- deren Beiträge fehlen in diesem Lauf, nicht im Blog. Ein neuer Lauf holt sie nach; ein größeres WAYBACK_DELAY verhindert es."
    wayback_unparsed: "%{count} archivierte Seiten ließen sich nicht als Beiträge lesen -- siehe die Zähler der Übersprungenen."
    wayback_cdx_truncated: "⚠️  Das Archiv lieferte genau so viele Aufnahmen wie das Limit (%{limit}), es hat also fast sicher mehr und der Rest wurde nie gelesen: %{list}. CDX antwortet vom ältesten an, es fehlt also das ENDE des Blogs, nicht der Anfang. Importiere abschnittsweise mit --from/--to."
    wayback_dated_by_capture: "%{count} Beitrag/Beiträge tragen das Datum des Schnappschusses -- die Seite selbst wusste nichts Besseres."
    wayback_lost_images: "%{count} Bild(er) hat das Archiv nie gespeichert -- ihre Beiträge kamen ohne sie an."
    wayback_summary_only: "%{count} von %{seen} Feed-Einträgen trugen nur eine Zusammenfassung, nicht den ganzen Beitrag -- dieses Blog veröffentlichte Auszüge, also kommen sie gekürzt an, egal wie viele Schnappschüsse es gibt."
    wayback_no_images: "Das Archiv hat für %{host} überhaupt keine Bilder: jedes Bild, auf das diese Beiträge zeigen, ist weg."
    wayback_images_spread: "Das Archiv hält %{count} Bild(er) von %{host} (%{spread}) -- Bilder aus Jahren, die dort fehlen, können nicht ankommen, egal worauf die Beiträge verweisen."
    wayback_unanswered: "%{count} Archiv-Anfrage(n) blieben auch nach Wiederholung unbeantwortet -- was sie hielten, fehlt in diesem Lauf. Ein neuer Lauf ist sicher und holt es nach."
    wix_dropped: "Rich-Content-Knoten ohne blog.sh-Entsprechung sind entfallen: %{listed}."
    mastodon_polls: "In eine Liste mit Stimmenzahlen umgewandelte Umfragen: %{count}."
    mastodon_withheld: "Nicht-öffentliche Beiträge als Entwürfe gespeichert statt veröffentlicht: %{count} (%{direct} Direktnachricht(en), %{followers} nur für Follower). Ein Archiv ist das ganze Konto, nicht die öffentliche Timeline -- sieh sie durch und veröffentliche nur, was nach außen gehört."
    mastodon_unlisted: "Als nicht gelistet markierte Beiträge: %{count}. Sie haben eine eigene Adresse, bleiben aber aus den Listen heraus, genau wie bei Mastodon."

# ./blog.sh doctor -- liest die Konfiguration auf der Platte und sagt, was
# daran nicht stimmt (lib/doctor.rb). Jede Zeile mit einem Hinweis muss
# für sich allein verständlich sein: Sie liest jemand, der nicht weiß, in
# welcher Datei die Einstellung steht, geschweige denn unter welchem
# Schlüssel.
doctor:
  heading: "Prüfung dieser Installation"
  running_online: "Prüft auch, ob Server und Zugriffstoken noch antworten (--online)"
  summary: "%{errors} Problem(e), %{warnings} zum Nachsehen, %{oks} in Ordnung."
  summary_clean: "Keine Probleme. %{oks} Prüfung(en) bestanden."
  hint_online: "Mit --online wird zusätzlich geprüft, ob die Feeds, das Analyseskript und der Zugriffstoken noch antworten."

  env_ok: "env.sh ist vorhanden und nur für dich lesbar."
  env_missing: "Es gibt keine env.sh, also sind weder Token noch ein Deploy-Ziel eingerichtet."
  env_missing_fix: "Führe ./setup.sh aus, oder kopiere von Hand: cp env.sh.example env.sh && chmod 600 env.sh"
  env_mode: "env.sh hat die Rechte %{mode} -- andere Benutzer dieses Rechners können deine Token lesen."
  env_mode_fix: "chmod 600 env.sh"

  site_yml_ok: "config/site.yml lässt sich lesen."
  site_yml_missing: "Es gibt keine config/site.yml, also kann nichts erzeugt werden."
  site_yml_missing_fix: "Führe ./setup.sh aus, oder kopiere die kommentierte Vorlage: cp config/site.yml.example config/site.yml"
  site_yml_empty: "config/site.yml ist leer oder enthält keine Einstellungen."
  site_yml_syntax: "config/site.yml ist kein gültiges YAML: %{message}."
  site_yml_unreadable: "config/site.yml existiert, lässt sich aber nicht lesen: %{message}."
  site_yml_unreadable_fix: "Prüfe Eigentümer und Rechte der Datei (ls -l config/site.yml). Meist hilft: chmod 644 config/site.yml — und wenn die Datei nach einem mit sudo gestarteten Assistenten root gehört, auch chown."
  site_yml_syntax_fix: "Sieh dir Zeile %{line}, Spalte %{column} an. Fast immer ist es die Einrückung (nur Leerzeichen, nie Tabulatoren), ein fehlendes Anführungszeichen oder ein Doppelpunkt in einem Wert ohne Anführungszeichen. Wenn diese Zeile in Ordnung aussieht, liegt die Ursache anderswo -- meist ein auskommentierter Abschnittskopf, dessen Schlüssel stehen geblieben sind, oder ein weiter oben offen gelassenes Anführungszeichen."

  identity_ok: "Die Identität der Website ist ausgefüllt."
  key_missing: "%{key} fehlt in config/site.yml."
  base_url_missing: "Die Website hat keine Adresse -- RSS, Sitemap und jede Vorschau beim Teilen brauchen eine."
  base_url_missing_fix: "Setze site.base_url in config/site.yml oder SITE_BASE_URL in env.sh."
  base_url_placeholder: "Die Adresse ist immer noch das https://example.com aus der Vorlage."
  base_url_placeholder_fix: "Lokal unproblematisch. Setze die echte Adresse vor dem Deploy, sonst zeigt jeder Link, den die Website über sich selbst veröffentlicht, auf example.com."
  base_url_shape: "Die Adresse (%{value}) ist keine URL."
  base_url_shape_fix: "Sie muss mit http:// oder https:// beginnen und einen Hostnamen enthalten."
  base_url_slash: "Die Adresse (%{value}) endet mit einem Schrägstrich, was in erzeugten Links doppelte Schrägstriche ergibt."
  base_url_slash_fix: "Entferne den Schrägstrich am Ende."
  page_size: "site.page_size ist %{value}; es muss eine ganze Zahl größer als null sein."
  locale_mismatch: "site.locale ist %{locale}, die Website ist aber in %{lang} geschrieben -- jede Seite meldet og:locale=\"%{locale}\" an alles, was es liest. Absicht (en_GB bei lang en) ist in Ordnung; sonst bring site.locale mit site.lang in Einklang."
  locale_mismatch_fix: "Absicht ist in Ordnung -- en_GB bei lang en ist eine echte Antwort. Sonst bring site.locale mit site.lang in Einklang; der Assistent schreibt beide zusammen."

  placeholders: "Immer noch der Text aus der Vorlage: %{keys}."
  placeholders_fix: "Lokal harmlos, aber genau das würden Besucher lesen. Nach Bio, Fußzeile und Links fragt ./style.sh."

  lang_unknown: "site.lang ist \"%{lang}\", aber es gibt keine passende locales/%{lang}.yml."
  lang_unknown_fix: "Verfügbar: %{available}. Wie man eine weitere hinzufügt, steht in docs/localization.md."

  timezone_ok: "Zeitstempel werden in %{zone} geschrieben."
  timezone_unknown: "site.timezone \"%{zone}\" ist keine Zeitzone, die dieser Rechner kennt."
  timezone_unknown_fix: "Nimm einen IANA-Namen wie Europe/Prague oder America/New_York (siehe /usr/share/zoneinfo), oder UTC. Ein Tippfehler würde jeden Beitrag stillschweigend falsch datieren."

  approval_ok: "Kommentare werden moderiert -- veröffentlicht wird nur, was du favorisierst."
  approval_boolean: "comments.approval steht auf on (oder yes), was YAML als Wahrheitswert liest, nicht als Modus."
  approval_boolean_fix: "Schreibe den Modus beim Namen: comments.approval: fav. (off und no werden verstanden, sie können nur eines bedeuten.)"
  approval_unknown: "Unbekannter Wert für comments.approval %{value} -- der Build lehnt ihn ab."
  approval_unknown_fix: "Es gibt nur zwei Werte: \"fav\" (nur favorisierte Antworten veröffentlichen) und \"off\" (alle veröffentlichen)."
  approval_key_unknown: "config/site.yml hat einen comments:-Abschnitt, aber nichts darin, was die Moderation liest (gefunden: %{keys}) -- es wird also jede Antwort veröffentlicht, unmoderiert."
  approval_key_unknown_fix: "Der Schlüssel heißt comments.approval, und \"fav\" veröffentlicht nur die Antworten, die du favorisierst. Wolltest du gar nicht moderieren, lösche den Abschnitt lieber: ein Schlüssel, den niemand liest, ist nicht dasselbe wie abgeschaltete Moderation -- der Unterschied zeigt sich erst an einer Antwort auf der Website, die du nie freigegeben hast."
  approval_no_network: "comments.approval ist an, aber es ist kein Netzwerk für Ankündigungen eingerichtet."
  approval_no_network_fix: "Die Moderation wählt aus den Antworten auf eine Ankündigung aus. Richte mastodon: oder bluesky: ein, oder setze comments.approval: off."
  approval_needs_cron: "Moderierte Kommentare erreichen die Seite nur über scripts/refresh-sidebar.sh."
  approval_needs_cron_fix: "Trage es in cron ein (*/30 * * * * /pfad/zu/blog.sh/scripts/refresh-sidebar.sh). Ohne das behält die Seite die zuletzt hochgeladenen Kommentare, und ein neu freigegebener erscheint nie."
  approval_probe_ok: "Der Token sieht, welche Antworten du favorisiert hast."
  approval_probe_nothing: "Es ist noch nichts angekündigt, also gab es keinen Thread, um den Token zu prüfen."
  approval_probe_blind: "Das Netzwerk antwortet, ohne zu sagen, welche Antworten du favorisiert hast -- jeder Thread der Seite käme leer heraus."
  approval_probe_blind_fix: "Der Mastodon-Token braucht neben write:statuses auch die Berechtigung read:statuses -- erstelle ihn unter Einstellungen -> Entwicklung neu. Bei Bluesky prüfe, ob BLUESKY_APP_PASSWORD ein App-Passwort für das Handle aus config/site.yml ist."
  approval_probe_failed: "Konnte nicht prüfen, ob der Token deine Favoriten sieht: %{message}"
  no_network: "Kein Netzwerk für Kommentare eingerichtet -- Beiträge werden nirgends angekündigt."
  credentials_no_network: "%{vars} ist in env.sh gesetzt, aber es ist kein Netzwerk-Abschnitt eingerichtet -- also wird nichts angekündigt und es werden keine Kommentare gelesen."
  credentials_no_network_fix: "Ein Token ohne Abschnitt, der ihn benutzt, heißt meist, dass der Kopf selbst noch auskommentiert ist: prüfe, dass %{sections} in config/site.yml eine echte Zeile ist und kein Kommentar, und dass die Schlüssel darunter stehen. Wenn die Website wirklich nirgends ankündigt, lösche die Zugangsdaten aus env.sh."
  both_networks: "Beide Abschnitte sind eingerichtet, mastodon: und bluesky:, und der Build lehnt das ab."
  both_networks_fix: "Kommentare und der Ankündigungsbeitrag leben auf genau einem Netzwerk. Kommentiere den aus, den du nicht willst."
  mastodon_instance_shape: "mastodon.instance ist \"%{value}\" -- dort gehört nur der Hostname hin, ohne https:// und ohne Pfad."
  mastodon_ok: "Angekündigt wird auf %{instance}."
  mastodon_token_missing: "mastodon: ist eingerichtet, aber MASTODON_ACCESS_TOKEN ist leer, also wird nie etwas angekündigt."
  mastodon_token_missing_fix: "Erstelle ihn auf der Instanz unter Einstellungen -> Entwicklung -> Neue Anwendung, Berechtigung write:statuses, und trage ihn in env.sh ein."
  toot_length: "mastodon.toot_length ist %{value}; es muss eine ganze Zahl größer als null sein."
  bluesky_ok: "Angekündigt wird als %{handle}."
  bluesky_password_missing: "bluesky: ist eingerichtet, aber BLUESKY_APP_PASSWORD ist leer, also wird nie etwas angekündigt."
  bluesky_password_missing_fix: "Auf Bluesky unter Settings -> App Passwords. Ein APP-Passwort, niemals das Kontopasswort. Trage es in env.sh ein."

  banner_ok: "Das Bannerbild ist vorhanden und die angegebene Größe passt zur Datei."
  banner_default: "Immer noch das Banner, das mit der Engine ausgeliefert wird."
  banner_missing: "Das Bannerbild %{path} ist nicht da, also zeigt jede Seite ein kaputtes Bild."
  banner_missing_fix: "Lege die Datei dorthin, wohin banner.src zeigt, oder ändere banner.src."
  banner_dimensions: "Das Banner ist mit %{declared} angegeben, die Datei ist aber %{actual}, also springt die Seite beim Laden."
  banner_dimensions_fix: "Setze banner.width auf %{width} und banner.height auf %{height}."

  colors_ok: "Die Palette ist vollständig und jeder Wert ist eine Farbe."
  colors_missing: "In der Palette %{mode} fehlen %{keys}; die fallen auf das Blau der Engine zurück."
  colors_missing_fix: "Setze entweder alle sieben oder lass den Abschnitt ganz weg -- eine halbe Palette mischt zwei Entwürfe."
  colors_hex: "colors.%{mode}.%{key} ist %{value}, das ist keine Farbe."
  colors_hex_fix: "Werte sehen aus wie \"#1da1f2\" oder \"#fff\" -- mit Anführungszeichen, sonst liest YAML das # als Kommentar."

  fonts_ok: "Jede in der Konfiguration genannte Schriftdatei liegt in assets/fonts/."
  fonts_missing: "In der Konfiguration genannt, aber nicht in assets/fonts/: %{files}."
  fonts_missing_fix: "Die Website rendert in der Ersatzschrift, was genau so aussieht, als würde die Konfiguration nicht wirken. Lege die Datei dorthin oder nimm sie aus fonts.faces heraus."

  extra_css_ok: "%{count} zusätzliche(s) Stylesheet(s), jedes ein Pfad auf dieser Website und vorhanden."
  nav_ok: "Menü: %{count} Eintrag/Einträge, jeder zeigt auf etwas Vorhandenes."
  nav_tag_missing: "Der Menüeintrag \"%{label}\" zeigt auf das Schlagwort %{tag}, das kein Beitrag trägt."
  nav_tag_missing_fix: "Dessen Liste wird nicht gebaut, der Eintrag ist also ein 404 im eigenen Menü. Meist wurde der letzte Beitrag damit zurückgezogen oder neu verschlagwortet. Korrigiere das Schlagwort oder entferne den Eintrag."
  nav_tag_display_form: "Der Menüeintrag \"%{label}\" zeigt auf das Schlagwort %{tag} -- das ist dessen Name und nicht der Slug, unter dem die Liste gebaut wird."
  nav_tag_display_form_fix: "Die Beiträge und die Liste gibt es beide, der Eintrag adressiert sie nur in der falschen Form und ist von jeder Seite der Website aus ein 404. Schreibe den Slug: %{slug}"
  nav_url_missing: "Der Menüeintrag \"%{label}\" zeigt auf %{url}, wo diese Website nichts ausliefert."
  nav_url_missing_fix: "Meist ein Beitrag, der nach dem Schreiben des Menüs umbenannt oder gelöscht wurde. Zeige auf etwas Vorhandenes oder entferne den Eintrag -- Adressen außerhalb dieser Website bleiben hier unberührt, dafür ist check --online da."
  nav_asset_missing_fix: "Die Adresse nennt eine Datei unter /assets/, die weder in den Quellen noch in der gebauten Seite liegt. Lege sie dort ab, korrigiere den Tippfehler oder entferne den Eintrag -- bis dahin antwortet jede Seite mit 404."
  nav_url_relative: "Der Menüeintrag \"%{label}\" zeigt auf %{url} -- das ist keine Adresse, sondern ein Name, der gegen die jeweilige Seite gelesen wird."
  nav_url_relative_fix: "Von der Startseite mag es sogar gehen, von einem Beitrag landet es neben dem Beitrag. Schreibe es mit Schrägstrichen: %{url}"
  extra_css_remote: "site.extra_css nennt %{value}, das auf einem anderen Host liegt."
  extra_css_remote_fix: "Jede Seite trägt style-src 'self', der Browser verwirft es also und die Website rendert ungestylt -- ohne Fehlermeldung an einer Stelle, an der du sie sehen würdest. Kopiere die Datei nach assets/ und nenne sie /assets/css/<name>.css."
  extra_css_missing: "site.extra_css nennt %{value}, das nicht im Baum liegt."
  extra_css_missing_fix: "Die Seite fordert es an, bekommt einen 404 und rendert ohne es -- das sieht genau nach einem Stylesheet aus, das nichts bewirkt. Lege die Datei dorthin oder streiche die Zeile."

  widgets_ok: "%{count} Seitenleisten-Widget(s), alle ausgefüllt."
  text_shape: "`%{key}` ist kein Text."
  text_shape_fix: "Das hier ist Prosa, die die Website einem Leser zeigt -- eine Textzeile (Markdown ist in Ordnung). Als Liste oder als Einstellungsabschnitt geschrieben wird sie gar nicht gezeichnet, und die Seite verliert sie stillschweigend."
  map_shape: "`%{key}` ist kein Abschnitt mit Einstellungen."
  map_shape_fix: "Dieser Schlüssel hält Einstellungen als `name: wert`-Zeilen darunter. Ein Schlüssel ohne Inhalt bedeutet keine davon, und das ist erlaubt."
  widget_unknown: "Die Seitenleiste hat keine Karte namens %{name}."
  widget_unknown_fix: "Die Karten sind toots, pixelfed, commits, bluesky und rss. Ein Name außerhalb dieser Liste wird von nichts gezeichnet -- und ist es das einzige eingetragene Widget, verschwindet die Spalte von jeder Seite."
  nav_item_shape: "Menüpunkt %{index} hat keine Beschriftung oder kein Ziel."
  nav_item_shape_fix: "Jeder Punkt braucht `label` und dazu entweder `tag` (einen Tag-Slug) oder `url`. Fehlt eine Hälfte, wird der Punkt übersprungen statt leer gezeichnet."
  sidebar_ok: "Seitenleiste: %{count} Karte(n)."
  sidebar_empty: "Die Seitenleiste ist an, aber es stünde nichts darin."
  sidebar_empty_fix: "Seit 1.4 wird die Spalte nur gezeichnet, wenn sie etwas zu halten hat; jede Seite wird also in voller Breite gebaut. Schreib einen Über-mich-Text oder ein Widget -- oder sag es absichtlich mit layout.sidebar: false."
  list_shape: "`%{key}` ist keine Liste."
  list_shape_fix: "Eine Liste besteht aus Zeilen, die unter dem Schlüssel mit \"- \" beginnen. Ein Schlüssel ohne Inhalt bedeutet keine Einträge, und das ist erlaubt."
  widget_shape: "Das Widget %{name} enthält keine Einstellungen."
  widget_shape_fix: "Ein Widget ist eine Sammlung von Einstellungen unter seinem Namen -- heading und was die Karte sonst braucht. Eine Liste oder ein blanker Wert wird von nichts gezeichnet."
  widget_incomplete: "Dem Widget %{name} fehlt %{key}, also kann es nie etwas anzeigen."
  widget_account_id: "Das Toots-Widget will die API-ID des Kontos und hat %{value}."
  widget_toots_instance: "Das Toots-Widget hat keine Instanz -- weder widgets.toots.instance noch mastodon.instance."
  widget_toots_instance_fix: "Trage mastodon.instance ein (z. B. mastodon.social) oder widgets.toots.instance, wenn das Widget ein anderes Konto zeigen soll."
  widget_account_id_fix: "Nicht den @Namen -- die ID: auf Mastodon eine Nummer, auf GoToSocial eine 26-stellige ULID. Öffne https://instanz/api/v1/accounts/lookup?acct=du und übernimm \"id\"; ./setup.sh sucht sie selbst heraus."
  widget_username: "`username` des Commits-Widgets ist kein Benutzername: %{value}."
  widget_username_fix: "Nur der Kontoname, wie die Forge ihn schreibt -- Buchstaben, Ziffern, Punkt, Bindestrich, Unterstrich. Kein @Handle, keine Profil-URL."
  widget_instance_repo: "`instance` des Commits-Widgets enthält einen Pfad: %{value}."
  widget_instance_repo_fix: "Das Widget will den Server selbst. Eine Forge, die wirklich unter einem Pfad liegt, ist in Ordnung -- aber eine Profil- oder Repository-Adresse sieht von hier genauso aus. Öffne <instance>/api/v1/version im Browser: eine Forge antwortet mit einer Version, alles andere nicht."
