  fallback_note: "%{count} Block/Blöcke, für die Markdown keine Schreibweise hat, wurden als HTML geschrieben: %{kinds}. Jede Engine, die HTML durchreicht, stellt sie dar, und diese Engine liest sie vollständig zurück -- jeder trägt seine eigene Definition in einem Kommentar darüber, den alle anderen ignorieren."
