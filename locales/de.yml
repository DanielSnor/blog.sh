    pages_imported: "%{count} Seite(n) kamen mit und liegen unter %{paths}. Noch verweist nichts auf der Website auf sie -- das Menü wird aus deinen Inhaltstypen abgeleitet, solange du nichts anderes sagst; trage sie also unter `nav:` in config/site.yml ein, wenn sie dorthin gehören."
