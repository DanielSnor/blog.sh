# ./setup.sh -- der Assistent für die Grundeinrichtung (scripts/setup.rb).
# Eine Eingabeaufforderung besteht aus Bezeichnung, Hinweis und dem
# vorausgefüllten Wert. Der Hinweis sagt, was die Einstellung bewirkt, und
# endet mit einem Beispiel, wo die Form der Antwort nicht offensichtlich
# ist -- auf einer frischen Installation ist der "aktuelle Wert" nur der
# Platzhalter der Vorlage und zeigt keine Form. Ob jemand den Wert
# wirklich gewählt hat, sagt die Zeile "Jetzt:" vs. "Vorschlag:"
# (wizard.prompt_with_current / prompt_with_suggestion).
setup:
  intro: "Hier werden die Einstellungen abgefragt, die eine Website zum Laufen braucht. Die Antworten werden unterwegs geprüft und in config/site.yml und env.sh geschrieben."
  intro_skip: "Jede Frage lässt sich überspringen -- Enter übernimmt den darunter vorausgefüllten Wert. Nichts wird geschrieben, bevor du alle Änderungen zusammen gesehen und bestätigt hast."
  intro_expert: "(Lieber selbst YAML bearbeiten? Der Assistent füllt nur config/site.yml aus, dessen kommentierte Vorlage config/site.yml.example ist.)"

  section_identity: "Wem die Website gehört"
  section_address: "Wo die Website wohnt"
  section_network: "Wo die Kommentare leben"
  section_deploy: "Wohin die Website veröffentlicht wird"

  q_title: "Vollständiger Titel"
