  thread_closed: "%{instance} lässt den Browser der Besucherin den Thread nicht lesen (antwortet mit 401/403)."
  thread_closed_fix: "Live-Kommentare können hier nicht funktionieren -- ein Token lässt sich nicht in einen Browser legen. Schalte `comments.approval: fav` in config/site.yml ein: Den Thread liest dann der Cron mit einem Token (Scope read:statuses), und auf die Seite kommen nur die Antworten, die du markiert hast. So arbeitet GoToSocial, und ein Mastodon im Secure Mode ebenso."
  thread_unchecked: "%{instance}: ließ sich nicht prüfen, ob der Thread ohne Anmeldung ausgeliefert wird (%{code})."

# ./setup.sh -- der Assistent für die Grundeinrichtung (scripts/setup.rb).
# Eine Eingabeaufforderung besteht aus Bezeichnung, Hinweis und dem
# vorausgefüllten Wert. Der Hinweis sagt, was die Einstellung bewirkt, und
# endet mit einem Beispiel, wo die Form der Antwort nicht offensichtlich
# ist -- auf einer frischen Installation ist der "aktuelle Wert" nur der
# Platzhalter der Vorlage und zeigt keine Form. Ob jemand den Wert
# wirklich gewählt hat, sagt die Zeile "Jetzt:" vs. "Vorschlag:"
# (wizard.prompt_with_current / prompt_with_suggestion).
check:
  progress_online: "Frage das Web: %{done}/%{total}"
  running_online: "Auch Links nach außen werden geprüft -- das dauert eine Weile."
  online_ok: "Alle %{count} externen Link(s) antworten weiterhin."
  link_gone: "%{slug}: %{url} ist weg (%{reason})."
  link_gone_fix: "Gemeldet werden nur Hosts, die nicht mehr auflösen, und Seiten mit 404/410 -- ein Timeout oder ein 5xx heißt \"gerade nicht\" und bleibt unangetastet. Korrigiere den Link, entferne ihn oder zeige auf die Wayback Machine."
  reason_no_host: "diesen Host gibt es nicht"
  repair_nothing: "Nichts zu reparieren -- das Archiv ist in Ordnung."
  repair_heading: "Das Archiv wird geprüft; zu jedem Fund folgt ein Reparaturvorschlag"
  repair_no_offer: "Hier gibt es nichts anzubieten: das entscheidest du."
  repair_no_offer_draft: "Der einzige Beitrag dieses Namens ist noch ein Entwurf, und ein Entwurf hat auf der Website noch keine Adresse -- veröffentliche ihn, und der Link repariert sich selbst."
  repair_no_offer_duplicate: "Zwei Beiträge tragen diesen Slug in verschiedenen Jahren, er benennt also keinen von beiden. Hier muss ein Mensch entscheiden."
  repair_add_redirect: "%{origin} in redirect_from von %{slug} (%{to}) eintragen -- eine hinzugefügte Zeile, und jeder Link auf die alte Adresse wird beantwortet, auch die von außen."
  repair_rewrite_link: "Den Link in %{slug} umschreiben: %{from} -> %{to}"
  repair_decode_entities: "Die Entity-Codes in %{slug} durch die Zeichen ersetzen, für die sie stehen: &amp; zu &, &lt; zu <. Die vorherige Version des Beitrags bleibt in der Historie."
  repair_rename_media_ref: "Den Namen eintragen, den das Verzeichnis wirklich verwendet, in %{slug}: %{from} -> %{to} (die Datei selbst bleibt unberührt)."
  repair_trash: "%{path} in den Papierkorb verschieben (wiederherstellbar, nie gelöscht)."
  repair_prompt: "Ausführen? [a] ja  [s] überspringen  [q] Ende"
  repair_applied: "Erledigt."
  repair_failed: "Nicht möglich -- es wurde nichts geändert."
  repair_busy: "Gerade schreibt etwas anderes in diese Installation, es wurde nichts geändert. Versuch es gleich noch einmal."
  repair_summary_failed: "Abgelehnt oder nicht ausgeführt: %{count}. Dort wurde nichts geändert."
  repair_summary: "Ausgeführt: %{applied}, übersprungen: %{skipped}, ohne Angebot: %{no_offer}."
  repair_rebuild: "Führe ./blog.sh rebuild aus, damit die Änderungen auf die Website kommen."
  unknown_option: "Unbekannte Option: %{option}. check kennt nur --online, --json und --repair."
  heading: "Archiv wird geprüft"
  progress: "Beiträge gelesen: %{done}/%{total}"
  no_posts: "Es gibt noch keine Beiträge zu prüfen."
  all_clear: "Im Archiv selbst ist alles in Ordnung: %{posts} Beitrag/Beiträge, Medien, Links und Weiterleitungen stimmen."
  series_similar: "Die Serien „%{a}“ (%{count_a} Beitrag/Beiträge) und „%{b}“ (%{count_b} Beitrag/Beiträge) unterscheiden sich nur um wenige Zeichen -- ein Tippfehler?"
  series_similar_fix: "Wenn es eine Serie ist, vereinheitliche die `series:`-Schreibweise in den Beiträgen -- verschiedene Schreibweisen gründen zwei Serien und teilen die Teile auf."
  media_missing: "%{slug}: Die Datei %{file} fehlt im Medienverzeichnis."
  media_unusable: "Beitrag '%{slug}': %{file} ist da, aber nicht lesbar -- %{cause}."
  media_cause_dir: "es ist ein Ordner, keine Datei"
  media_cause_unreadable: "das Leserecht fehlt"
  media_cause_empty: "sie hat null Bytes"
  media_cause_broken_link: "es ist ein Link auf eine Datei, die es nicht gibt"
  media_unusable_fix: "Ein abgebrochener Download, ein fehlendes Leserecht oder ein Ordner unter dem Namen des Bildes. Lege eine echte Kopie der Datei dorthin; bis dahin zeigt die Seite ein kaputtes Bild."
  media_missing_fix: "Der Beitrag fordert sie an, die Seite zeigt ein Loch. Meist ein Import mit fehlgeschlagenem Download -- lege die Datei dorthin oder nimm sie aus dem Beitrag heraus."
  image_degenerate: "%{slug}: Das Bild %{file} ist %{width}x%{height} und wird gar nicht gerendert."
  image_degenerate_fix: "Alles mit 1px oder weniger gilt als Zählpixel und wird MITSAMT Bildunterschrift verworfen, die Seite verliert also beides stillschweigend. Tausche das Bild aus oder entferne den Block."
  link_dead: "%{slug}: verweist auf %{url}, wo diese Website nichts ausliefert."
  link_dead_fix: "Meist ein Permalink aus einem Import oder ein Slug, der umbenannt wurde, bevor Umbenennungen eine Weiterleitung behielten. Korrigiere den Link oder gib dem Zielbeitrag einen redirect_from-Eintrag."
  link_relative: "%{slug}: verweist auf %{url}, was relativ zum Beitrag selbst gelesen wird, nicht zur Website."
  link_relative_fix: "Drei Formen, drei verschiedene Korrekturen: ein Link auf einen anderen Beitrag dieser Website (schreibe ihn als /posts/<Jahr>/<Slug>/), ein blanker Hostname, dem nichts als das Protokoll fehlt (die Adresse stimmt -- ergänze https://), und eine absolute URL mit einem verirrten Zeichen davor (\" oder :). Alle drei werden innerhalb der URL des Beitrags aufgelöst, und einen Query-String ignoriert ein statischer Host -- er antwortet mit 200 und genau der Seite, auf der die Leserin bereits steht. Nichts geht kaputt, und niemand kommt an. Ob das Ziel noch antwortet, ist eine Frage für check --online."
  media_orphan: "Zum Medienverzeichnis %{dir} gehört kein Beitrag."
  media_orphan_fix: "Rest eines gelöschten oder umbenannten Beitrags oder eines doppelt gelaufenen Imports. Nichts verweist darauf; lösche es selbst, nachdem du hineingesehen hast."
  media_misnamed: "%{slug}: nennt die Datei %{file}, das Medienverzeichnis führt sie aber als %{actual}."
  media_misnamed_form: "%{slug}: nennt die Datei %{file} in einer anderen Unicode-Form als der, die das Medienverzeichnis führt."
  media_misnamed_fix: "Die Bytes sind in Ordnung, nur die Schreibweise im Beitrag weicht ab. Auf einem Dateisystem ohne Groß-/Kleinschreibung (macOS) wird die Seite weiterhin gezeichnet und es ist Aufräumen; auf einem mit (die meisten Server) fehlt das Bild bereits. `./blog.sh check --repair` bietet an, den Namen einzutragen, den das Verzeichnis wirklich verwendet."
  media_misnamed_both_fix: "Dieser Beitrag verweist an anderer Stelle bereits auf die richtige Schreibweise, deshalb wird keine Umbenennung angeboten: sie auch hier einzutragen hieße zwei Blöcke auf einem Bild und das andere verloren. Sieh dir den Beitrag an und entscheide, welcher Block welche Datei tragen soll."
  media_stray: "Beitrag %{slug} nennt die Datei %{file} in seinem Medienverzeichnis nicht mehr."
  media_stray_fix: "Übrig von einem Bild, das die Quelle zwischen Importen entfernt oder umbenannt hat. Der Beitrag verweist nicht darauf; sieh nach und lösche sie selbst."
  address_duplicate: "%{count} Beiträge würden unter /posts/%{year}/%{slug}/ ausgeliefert."
  post_unreadable: "%{file} ließ sich nicht lesen (%{reason})."
  json_and_repair: "❌ --json und --repair gehen nicht zusammen: --json beschreibt das Archiv, wie es ist, --repair verändert es. Führe erst `check --repair` aus, danach `check --json`."
  post_unreadable_fix: "Der Build läuft in diesem Zustand gar nicht. Repariere die Datei oder lege sie beiseite -- solange sie so dort liegt, weiß check nichts von ihr und die Site wird nicht gebaut."
  post_content_unreadable: "%{file} hat seinen Text in etwas, das keine Liste von Blöcken ist (%{value})."
  post_bad_slug: "%{file} hat einen Slug, der kein einzelnes Pfadsegment ist (%{slug})."
  post_bad_slug_fix: "Ein Slug wird zur Adresse des Beitrags, eine Ordnerebene tief. Ein Schrägstrich oder ein `..` darin lässt den Build außerhalb schreiben oder abbrechen. Benenne den Beitrag um: ./blog.sh props <slug> -> [r]."
  post_entities: "%{slug}: Der Text enthält HTML-Entities (%{entities}) statt der Zeichen, für die sie stehen."
  post_entities_fix: "Stammt aus einem Archiv, das sie maskiert hat (Twitter tut das mit &, < und >); die Engine dekodiert sie seit 1.4, ältere Importe nicht. `check --repair` bietet die Umwandlung an. Wenn die Entities Absicht waren, lass sie stehen."
  parked_leftover: "Ein unterbrochener Warteschlangen-Umzug hat %{file} unter einem Arbeitsnamen abgestellt."
  parked_leftover_fix: "Die Datei (oder der Ordner) ist ein Beitrag, seine Medien oder seine Bearbeitungshistorie, eine Umbenennung von ihrem Platz entfernt: führenden Punkt und die Endung .queue-move entfernen, und sie ist zurück."
  parked_leftover_fix_stale: "Derselbe Beitrag liegt im Archiv unter %{live}, das hier ist also die Kopie, die der unterbrochene Umzug zurückgelassen hat. Vergleiche beide und lösche diesen Rest, sobald der lebende vollständig ist. Benenne ihn NICHT zurück: das Archiv hätte den Beitrag sonst zweimal."
  parked_leftover_fix_blocked: "%{home} ist von einem ANDEREN Beitrag belegt, und dieser hier steht sonst nirgends im Archiv -- diese Datei kann also die einzige Kopie davon sein. Benenne sie nicht über das, was dort liegt, und lösche sie nicht: vergleiche beide und lege diese dann unter einem freien Namen ab (das Jahr bestimmt ihr Datum)."
  post_content_unreadable_fix: "Der Inhalt eines Beitrags ist eine Liste, ein Eintrag pro Block. An allem anderen endet der Build mit einem Fehler. Öffne ihn mit ./blog.sh edit oder stelle eine ältere Fassung über props [v] wieder her."
  post_date_unreadable: "%{file} hat kein Datum, mit dem sich arbeiten ließe (%{value})."
  post_date_unreadable_fix: "Das Datum bestimmt Adresse und Reihenfolge, der Build endet daran mit einem Fehler. Schreibe es als 2026-08-22T10:00:00+02:00."
  address_duplicate_fix: "Der Build läuft in diesem Zustand gar nicht -- ein Beitrag würde den anderen überschreiben und ihre Medien vermischen. Gib einem von beiden einen anderen Slug (`./blog.sh props` -> Adresse) oder ein Datum in einem anderen Jahr."
  address_duplicate_page: "%{count} Seiten würden unter /%{slug}/ ausgeliefert."
  address_duplicate_page_fix: "Eine Seite hat kein Jahr in ihrer Adresse, ein anderes Datum trennt sie also nicht. Die Site wird weiterhin gebaut, ausgeliefert wird aber nur eine der beiden -- die andere bleibt in der Sitemap und in der Suche und führt zu fremdem Text. Gib einer von beiden einen anderen Slug (`./blog.sh props` -> Adresse)."
  redirect_collision: "Auf %{origin} erheben mehrere Beiträge Anspruch: %{slugs}."
  redirect_collision_fix: "Der zuletzt gerenderte gewinnt, die Leser der anderen landen bei ihm. Belasse den Eintrag bei nur einem Beitrag."
  redirect_from_reserved: "%{slug}: das redirect_from %{entry} wird nicht ausgeliefert -- sein erstes Segment gehört der Website selbst."
  redirect_from_reserved_fix: "Der Build lehnt es ab und sagt es einmal, mitten in einem Log, das niemand aufhebt -- die alte Adresse liefert also stillschweigend 404. Zeige woandershin als in den eigenen Namensraum der Website (posts, page, tag, type, assets, search, markdown), oder nimm den Eintrag heraus."
  redirect_from_unusable: "%{slug}: das redirect_from %{entry} wird nicht ausgeliefert -- aus dieser Form kann der Build kein Verzeichnis machen."
  redirect_from_unusable_fix: "Eine Query, ein Fragment, ein Segment . oder .., oder ein Segment, das für einen Dateinamen zu lang ist. Erwartet wird ein Pfad ab der Wurzel wie \"/alter-beitrag/\". Korrigiere ihn, oder nimm den Eintrag heraus."
  and_more: "...und %{count} weitere derselben Art, nicht aufgeführt."
  summary: "%{errors} Problem(e), %{warnings} Sache(n) zum Nachsehen."
  summary_clean: "Das Archiv ist in Ordnung."

stats:
  # Absagen, die lib/post_stats.rb auf dem Cron-Weg wirft. Sie erreichen
  # einen Menschen zweimal -- als Zeile in der Cron-Mail und mitten im Satz,
  # den doctor --online über das Token schreibt -- auf einer Website, die
  # nicht englisch ist, war das ein halber Satz in der falschen Sprache.
  no_mastodon_token: "comments.approval ist an, aber MASTODON_ACCESS_TOKEN ist nicht gesetzt -- ohne das sagt die API nie, welche Antworten du favorisiert hast."
  no_bluesky_password: "comments.approval ist an, aber BLUESKY_APP_PASSWORD ist nicht gesetzt -- ohne das sagt die API nie, welche Antworten dir gefallen."
  blind_answer: "comments.approval ist an, aber die Antwort von %{network} sagte nicht, welche Beiträge favorisiert sind -- die Anfrage war nicht authentifiziert, oder dem Token fehlt read:statuses. Wird abgelehnt, statt ein leeres Gespräch über die bereits freigegebenen Kommentare zu schreiben."
  # Warum das Laden und die Freigabe-Prüfung gar nicht laufen können, aus
  # demselben Grund wie die drei Sätze darüber: fetch_one zitiert sie in
  # eine Warnung, die den Beitrag nennt, und doctor setzt sie ganz in
  # %{message} von approval_probe_failed ein. Je eine Zeile -- doctor
  # zitiert die erste und nichts danach.
  probe_unreadable_url: "mastodon_url %{url} ist keine Adresse, die diese Engine lesen kann -- erwartet wird https://instanz/@benutzer/123 oder https://instanz/users/benutzer/statuses/123, für diesen Beitrag lassen sich also weder Reaktionen noch Kommentare laden."
  probe_foreign_instance: "die neueste Ankündigung liegt auf %{instance}, was nicht die Instanz aus config/site.yml ist -- der Token wird zum Testen nicht an einen anderen Server geschickt, die Sichtbarkeit der Favoriten lässt sich von hier also nicht prüfen."
  probe_no_thread: "die Ankündigung %{key} kam nicht aus dem Netz zurück -- gelöscht, blockiert oder kurz nicht erreichbar, es gab also keinen Thread, an dem sich das App-Passwort prüfen ließe."
  unknown_option: "Unbekannte Option: %{option}. stats kennt nur --json."
  no_posts: "Es gibt noch nichts zu zählen."
  heading_archive: "Das Archiv"
  heading_years: "Nach Jahr"
