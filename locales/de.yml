  double_frontmatter_error: |
    ❌ Im Text steht ein zweiter Frontmatter-Kopf.

    Sieht so aus, als hättest du Text eingefügt, der schon eigene ---
    Zeilen mitbringt, unter den Kopf, der bereits da war. Verarbeitet wird
    nur der erste -- der Beitrag bliebe also ohne Titel und bekäme einen
    Slug aus den ersten Wörtern des Textes.

    Behalte nur einen Kopf: lösch entweder den leeren oben, oder entferne
    die --- Zeilen aus dem eingefügten Text und übertrag dessen Werte in
    den oberen.

  frontmatter_hint: |
    <!--
    HINWEIS -- dieser Block und Zeilen, die mit // beginnen, werden beim
    Speichern entfernt und landen nie im Beitrag.
    (Eigene Notizen also mit // schreiben, nicht mit # -- Rauten sind für
    Überschriften reserviert.)

    FRONTMATTER (zwischen --- und ---):
      title  Überschrift (optional)
      tags   Schlagwörter, kommagetrennt, z. B.: natur, wandern, stadt
      type   Beitragstyp -- text / quote / chat / image / video / audio /
             link (optional -- leer lassen, dann wird der Typ aus dem
             Inhalt abgeleitet)

    Das Veröffentlichungsdatum wird hier nicht gesetzt -- [p] nimmt den
    Moment der Veröffentlichung, [s] fragt nach Datum und Uhrzeit. Zum
    Rückdatieren eine date:-Zeile selbst in den Kopf schreiben -- die
    Veröffentlichung übernimmt sie.

    INHALT kommt unter das zweite ---. Zur Formatierungssyntax:

      Markdown-Spickzettel -- %{cheat_sheet_url}
    -->

