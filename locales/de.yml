# locales/de.yml -- deutsche Übersetzung. Jeder hier fehlende Schlüssel
# fällt automatisch auf locales/en.yml zurück (siehe lib/i18n.rb), eine
# unvollständige Übersetzung bricht also nichts.
#
# Konventionen: durchgängig Du-Form (wie die tschechische Locale),
# deutsche Anführungszeichen („…“), Datumsformat TT.MM.JJJJ -- passend zu
# js.date_locale weiter unten, beide zusammen ändern.

thousands_separator: "."
decimal_point: ","
date_format: "%d.%m.%Y"
date_time_format: "%d.%m.%Y %H:%M"

nav:
  all: "Alle"
  text: "Text"
  quotes: "Zitate"
  chat: "Chat"
  images: "Bilder"
  video: "Video"
  links: "Links"
  audio: "Audio"
  documents: "Dokumente"
  menu_label: "Menü"
  search_label: "Suche"
  search_placeholder: "Suchen…"

# Die eigene Sprache des Builds -- was er am Ende sagt und womit er
# abbricht, wenn das Archiv nicht gebaut werden kann.
build:
  unreadable_posts: "❌ Nicht lesbare Beitragsdateien in content.nosync/posts/ -- Build angehalten:"
  duplicate_address: "❌ Zwei Beiträge unter einer Adresse in content.nosync/posts/ -- Build angehalten:"
  # Jede Zahl bekommt ihre eigene Beschriftung -- „Beiträge: 1“ statt
  # „1 Beiträge“ --, denn das I18n der Engine kennt keine Pluralformen und
  # bekommt auch keine. Ein Satz, der das Wort beugen muss, liest sich bei
  # irgendeiner Zahl immer falsch; Beschriftung und Doppelpunkt bei keiner.
  summary: "Gebaut nach %{dir} -- Beiträge: %{posts}, Listenseiten: %{pages}, Schlagwortseiten: %{tags}, dazu ein Suchindex, RSS-Feed und Sitemap"
  drafts: "Entwürfe in Arbeit (nur Vorschau, in keiner Liste): %{count}"
  two_pages: "⚠️  %{count} Beiträge werden unter /%{slug}/ ausgeliefert, tatsächlich aber nur einer:"
  two_pages_fix: "   Die Site wird weiterhin gebaut, die Adresse behält der ÄLTERE; der andere bleibt\n   in der Sitemap und in der Suche und führt Leser zu fremdem Text.\n   Gib einem von beiden einen anderen Slug (./blog.sh props -> Adresse)."
  # Was der Build über das sagt, was er nicht gebaut hat -- in der
  # Reihenfolge, in der er darauf stößt. All das kommt in echten Archiven
  # vor: die Weiterleitungslisten bringt ein Import mit, den Rest ein von
  # Hand bearbeitetes JSON. Jede Zeile nennt den Beitrag, um den es geht,
  # denn der Build läuft ohne ihn weiter.
  extra_css_offsite: "⚠️  site.extra_css: %{value} ist kein Pfad auf dieser Website, die Content-Security-Policy der Seite würde die Datei also verwerfen -- übersprungen. Kopiere sie nach assets/ und benenne sie als /assets/css/<name>.css."
  page_reserved_name: "⚠️  Die Seite „%{slug}“ läge auf einer Adresse, die die Engine selbst benutzt (/%{slug}/) -- nicht gebaut. Benenne sie um."
  draft_no_token: "⚠️  Der Entwurf „%{slug}“ hat kein draft_token -- seine Vorschau läge auf einer erratbaren Adresse und wird deshalb nicht gebaut. Speichere ihn mit ./blog.sh edit erneut."
  pinned_more_than_one: "⚠️  Mehr als ein Beitrag ist angeheftet; verwendet wird der neueste (%{slug})."
  tag_too_long: "⚠️  Das Schlagwort „%{name}…“ ist zu lang für die Adresse einer Listenseite -- an seinen Beiträgen steht es, eine /tag/-Seite wird dafür aber nicht gebaut."
  series_too_long: "⚠️  Die Serie %{name} hat einen für eine Adresse zu langen Namen und bekommt daher keine Übersichtsseite. Alles andere an der Serie funktioniert; gib ihr einen kürzeren Namen, wenn du eine willst."
  page_size_unusable: "⚠️  site.page_size ist %{value}, womit sich nicht blättern lässt -- gebraucht wird eine ganze Zahl größer als null. Gebaut wird mit 10; `./blog.sh doctor` sagt dasselbe dazu."
  archive_span_absurd: "⚠️  Das Archiv reicht von %{from} bis %{to} -- fast sicher ein Tippfehler und kein Datum. Die Übersicht zeigt daher nur Jahre mit Inhalt; korrigiere das Datum, dann kommen die leeren Jahre zurück."
  former_slug_unusable: "⚠️  %{slug}: unbrauchbarer former_slugs-Eintrag %{entry} -- erwartet wird „Jahr/Slug“."
  former_slug_taken: "⚠️  %{slug}: Weiterleitung von %{former} übersprungen -- diese Adresse ist schon belegt (eine lebende Seite oder die Weiterleitung eines früheren Beitrags)."
  redirect_from_unusable: "⚠️  %{slug}: unbrauchbarer redirect_from-Eintrag %{entry} -- erwartet wird ein Pfad ab der Wurzel der Website, etwa „/alter-beitrag/“."
  redirect_from_reserved: "⚠️  %{slug}: redirect_from %{entry} übersprungen -- /%{segment}/ gehört der Website selbst."
  redirect_from_taken: "⚠️  %{slug}: redirect_from %{origin} übersprungen -- diese Adresse ist schon belegt (eine lebende Seite, eine Datei der Website oder eine frühere Weiterleitung)."
  redirect_from_directory: "⚠️  %{slug}: redirect_from %{origin} übersprungen -- eine frühere Weiterleitung hat aus dieser Adresse schon ein Verzeichnis gemacht."
  # Auf einem echten Archiv die häufigste davon und die letzte, die im
  # Build noch als Literal stand: ein Beitrag nennt ein Bild, das sein
  # Medienordner nicht hat. Jeder Import, der auf einen toten Bild-Host
  # traf, hinterlässt ein paar davon.
  media_missing: "⚠️  %{slug}: nennt eine Mediendatei, die sein Ordner nicht hat -- %{filename}. Die Seite verlinkt sie weiterhin, diese Adresse bleibt also ein 404, bis die Datei da ist."
  # Gar nicht die Schuld eines Archivs: der Spickzettel kommt mit der Engine.
  cheat_sheet_missing: "⚠️  %{path} fehlt -- die Spickzettel-Seite /markdown/ wird nicht gebaut. Sie kommt mit der Engine; meist steckt ein schiefgegangener Pull dahinter."
  # Der Schluss der Bilanz, gezählt mit Beschriftung wie alles darüber.
  pruned: "Dateien, die nichts mehr erzeugt, entfernt: %{count}"

