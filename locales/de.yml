  q_description: "Beschreibung in einem Satz"
  h_description: "Worum es auf der Website geht. Steht auf dem Banner, in Vorschauen beim Teilen von Links und in RSS-Readern. Reiner Text ohne HTML -- z. B.: Ich schreibe über Garten, Bücher und alles, was mich freut."
  q_author: "Autor"
  h_author: "Dein Name oder Spitzname, so wie er im RSS-Feed und in den Seiten-Metadaten stehen soll."
  q_timezone: "Zeitzone"
  h_timezone: "Veröffentlichungszeiten werden in dieser Zone gerechnet. Ein IANA-Name wie Europe/Berlin. Vorsicht bei Servern: die Maschine läuft oft auf UTC, hierher gehört aber die Zone, in der du lebst."
  e_timezone: "Dieser Rechner kennt keine Zone namens \"%{zone}\". Zonen heißen Kontinent/Stadt, auf Englisch -- Europe/Berlin, nicht Berlin oder MEZ; die vollständige Liste steht in /usr/share/zoneinfo."

  q_base_url: "Adresse der Website"
  h_base_url: "Die Adresse, unter der die Website zu sehen sein wird, z. B. https://meineseite.de -- ohne Schrägstrich am Ende. RSS, Sitemap und Vorschauen beim Teilen werden daraus gebaut. Wird in config/site.yml und env.sh zugleich geschrieben, damit die beiden Kopien nicht auseinanderlaufen."
