  unreadable_post: "⚠️  Überspringe unlesbare Beitragsdatei %{path}: %{error}"
  editor_buffer_kept: "Dein Text ist nicht verloren -- er liegt in %{path}, und das nächste add/edit bietet ihn wieder an."
