  deploy_args_fix: "In dieser Zeile in env.sh fehlt vermutlich ein schließendes Anführungszeichen. Schalter werden dort als normaler Text in Anführungszeichen geschrieben, zum Beispiel \"-P 2022 -i /home/dan/.ssh/key\"."
  deploy_guard_shrink_files: "❌ Angehalten: public.nosync/ hat %{have} Dateien, laut %{source} sollten es %{expected} sein.\n   Das ist ein Rückgang um %{percent} % -- das sieht nach einem kaputten Build aus.\n   Sieh dir die Build-Ausgabe an. Wenn der Rückgang so gewollt ist (viele Beiträge gelöscht), führe es erneut mit --force aus."
  deploy_guard_shrink_bytes: "❌ Angehalten: public.nosync/ umfasst %{have}, laut %{source} sollten es %{expected} sein.\n   Die Dateizahl wirkt dabei plausibel -- es fehlt also Inhalt INNERHALB der Seiten, nicht die Seiten selbst.\n   Sieh dir die Build-Ausgabe an. Wenn der Rückgang so gewollt ist, führe es erneut mit --force aus."
  deploy_guard_growth_files: "❌ Angehalten: public.nosync/ hat %{have} Dateien, laut %{source} sollten es nur %{expected} sein.\n   Das ist ein Zuwachs um %{percent} % -- das sieht nach einem doppelten oder kaputten Build aus.\n   Sieh dir die Build-Ausgabe an. Wenn der Zuwachs so gewollt ist (ein Massenimport oder eine Migration), führe es erneut mit --force aus."
  deploy_only_unknown: "❌ %{names}: in public.nosync/ nicht gefunden."
  deploy_ref_baseline: "dem letzten akzeptierten Build (%{at})"
  deploy_ref_manifest: "dem Manifest (noch kein akzeptierter Build vermerkt)"
  deploy_state_unwritable: "Der Upload selbst lief durch, nur die Notiz darüber ließ sich nicht schreiben -- vermutlich ist die Platte voll. Der nächste Lauf lädt deshalb alles erneut hoch; schaffe Platz, dann bleibt es folgenlos."
  # Der Rest dessen, was scripts/deploy_web.rb laut sagt. Zahlen sind so
  # formuliert, dass keine Sprache Pluralformen braucht; die Bezeichnung
  # des Backends und die Adresse des Ziels werden unverändert eingesetzt
  # -- so nennt sich das Werkzeug selbst, und so steht es in env.sh.
  deploy_header: "Deploy der Website -> %{backend}: %{target}"
