  image_dimensions_unknown: "⚠️  %{file}: Die Bildgröße ist nicht lesbar, die Seite kann keinen Platz dafür reservieren und springt beim Laden möglicherweise. PNG, JPEG, GIF und WebP werden immer gelesen."
  image_heic_hint: "   HEIC zeigt nur Safari an -- wandle es zuerst um: sips -s format jpeg DATEI --out DATEI.jpg (macOS), heif-convert DATEI DATEI.jpg (Linux)."
  frontmatter_date_invalid: "❌ Das Datum %{value} lässt sich nicht lesen -- erwartet YYYY-MM-DD [HH:MM]. Der Text bleibt im Puffer; öffne den Beitrag nach der Korrektur erneut."
  post_changed_while_editing: "❌ '%{slug}' wurde während des Bearbeitens auf der Festplatte geändert (der Cron veröffentlicht geplante Beiträge selbst). Es wurde nichts gespeichert, also ging von dieser Änderung nichts verloren -- öffne den Beitrag erneut und wende deine Änderung auf die aktuelle Fassung an."
  unknown_frontmatter_key: "❌ Unbekannter Schlüssel im Kopf: %{keys}. Bekannt: %{known}. Ein Tippfehler würde beim Speichern still verworfen, also wurde nichts geschrieben -- dein Text bleibt erhalten, siehe unten."
  heic_refused: "❌ %{files}: HEIC zeigt nur Safari an -- andere Browser würden ein kaputtes Bild zeigen. Es wurde nichts gespeichert, die Datei bleibt, wo sie ist. Wandle sie zuerst um (%{command}), oder setze media.convert_heic: true in config/site.yml und die Engine erledigt das selbst."
  heic_no_tool: "❌ %{files}: media.convert_heic ist an, aber kein Konverter wurde gefunden (versucht: sips, heif-convert, heif-dec, magick/convert, vips). Es wurde nichts gespeichert. Wandle von Hand um: %{command}"
  heic_converted: "🔄 %{file} → %{target} (HEIC umgewandelt via %{tool})."
  heic_convert_failed: "❌ %{file}: HEIC-Umwandlung via %{tool} fehlgeschlagen -- es wurde nichts gespeichert, die Datei bleibt, wo sie ist. Wandle von Hand um: %{command}"
  media_too_large: "❌ %{files}: über dem Limit von %{limit} pro Datei, das das strengste Deploy-Ziel ablehnt -- es wurde nichts gespeichert, die Datei bleibt, wo sie ist. Verkleinere sie, oder lass sie aus dem Beitrag heraus und verlinke sie."
  media_large: "⚠️  %{files}: nahe am Limit von %{limit} pro Datei. Gespeichert -- aber jeder Leser zahlt diese Bytes, überlege eine Verkleinerung."
  # Eine Datei kommt in einem Medienverzeichnis unter einem Namen an, der
  # schon belegt ist. Die im Weg wird beiseitegelegt statt überschrieben,
  # und laut benannt -- an einer fremden Datei sagt nichts, dass man sie
  # wegwerfen darf. Das Präfix „media:“ ist das Verzeichnis, kein Wort zum
  # Übersetzen.
  media_name_taken: "media: %{name} war schon belegt -- die Datei, die dort lag, heißt jetzt %{moved}"
  video_hevc: "⚠️  %{files}: als HEVC aufgenommen -- die meisten Browser spielen das ab, aber nicht alle; die übrigen Leser bekommen statt des Videos einen leeren Player. Gespeichert wird es trotzdem. Neu kodiert läuft es überall (braucht ffmpeg -- auf dem Mac `brew install ffmpeg`):\n     %{command}"
  video_quicktime: "⚠️  %{files}: ein QuickTime-.mov-Container. Das Video darin ist in Ordnung, aber den Container akzeptiert nicht jeder Browser; .mp4 nehmen alle. Gespeichert wird es trotzdem. Das Umpacken kopiert das Video unverändert, ohne neu zu kodieren (braucht ffmpeg):\n     %{command}"
  embed_lookup_working: "🔎 %{url}: frage den Dienst nach seinem Player…"
  embed_lookup_failed: "⚠️  %{url}: kein Player gefunden -- der Dienst hat nicht geantwortet oder bietet für diese Adresse keinen. Gespeichert wurde stattdessen der Link; erneutes Bearbeiten und Speichern versucht es noch einmal."

  double_frontmatter_error: |
    ❌ Im Text steht ein zweiter Frontmatter-Kopf.

    Sieht so aus, als hättest du Text eingefügt, der schon eigene ---
    Zeilen mitbringt, unter den Kopf, der bereits da war. Verarbeitet wird
    nur der erste -- der Beitrag bliebe also ohne Titel und bekäme einen
    Slug aus den ersten Wörtern des Textes.

    Behalte nur einen Kopf: lösch entweder den leeren oben, oder entferne
    die --- Zeilen aus dem eingefügten Text und übertrag dessen Werte in
    den oberen.

  frontmatter_hint: |
    <!--
    HINWEIS -- dieser Block und Zeilen, die mit // beginnen, werden beim
    Speichern entfernt und landen nie im Beitrag.
    (Eigene Notizen also mit // schreiben, nicht mit # -- Rauten sind für
    Überschriften reserviert.)

    FRONTMATTER (zwischen --- und ---):
      title  Überschrift (optional)
      tags   Schlagwörter, kommagetrennt, z. B.: natur, wandern, stadt
      type   Beitragstyp -- text / quote / chat / image / video / audio /
             link (optional -- leer lassen, dann wird der Typ aus dem
             Inhalt abgeleitet)
             page -> eine Seite: eigene Adresse, außerhalb der Listen,
             der Archive und des Feeds (Über mich, Kontakt)
      pinned true -> der Beitrag bleibt oben auf der ersten Listenseite
      unlisted true -> der Beitrag behält seine Adresse, verschwindet aber
             aus Listen, Feeds, Sitemap und Suche (ein Link für wenige,
             kein Passwort)
      series Name einer Serie; Beiträge mit gleichem Namen bilden eine
      hero   true/false -> Leitbild über dem Titel für diesen Beitrag
      toc    true/false -> Kapitelliste (ab vier Überschriften von selbst)

    Das Veröffentlichungsdatum wird hier nicht gesetzt -- [p] nimmt den
    Moment der Veröffentlichung, [s] fragt nach Datum und Uhrzeit. Zum
    Rückdatieren eine date:-Zeile selbst in den Kopf schreiben -- die
    Veröffentlichung übernimmt sie.

    INHALT kommt unter das zweite ---. Zur Formatierungssyntax:

      Markdown-Spickzettel -- %{cheat_sheet_url}
    -->

  template_unchanged: "Vorlage unverändert (nicht gespeichert?), es wurde kein Beitrag angelegt."
  empty_content: "Leerer Inhalt, nichts geschrieben."
  wrote_draft: "Als Entwurf gespeichert: %{path}"
