  kind: "Suche"
  tagline: "Durchsucht alle Beitragstypen — unabhängig von Akzenten und Umlauten."
  tip: "Tipp: bei mehreren Wörtern müssen alle vorkommen;<br>eine exakte Wendung in Anführungszeichen setzen („…“);<br>ein Wort mit Minus ausschließen (-wort)."
  prompt: "Gib eine Suchanfrage ein."
  page_title: "Suche – %{site_title}"
  page_description: "Volltextsuche über alle Beiträge, unabhängig von Akzenten."

