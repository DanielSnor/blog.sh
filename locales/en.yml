  q_section: "What do you want to change?"
  menu_palette: "Palette -- the seven colours per mode, light and dark"
  menu_banner: "Banner -- the image across the top, and its size"
  menu_about: "About -- the heading and your bio"
  menu_footer: "Footer -- headings, the copyright line, the note, the links"
  menu_social: "Social -- the row of icons in the footer, and Mastodon verification"
  menu_widgets: "Sidebar -- recent toots, Pixelfed, commits, Bluesky, any RSS feed"
  menu_fonts: "Fonts -- the typeface and size of the name and description on the banner"
  menu_layout: "Layout -- which regions of the page exist, and your own stylesheet"
  menu_nav: "Menu bar -- what stands in the strip under the banner"
  menu_analytics: "Analytics -- the script, if you run one"

  palette_intro: "A palette is seven colours per mode. Everything else -- card backgrounds, hover colours, the search field -- is worked out from them at build time on its own."
