  note:
    pages_imported: "%{count} page(s) came across and are at %{paths}. Nothing on the site links to them yet -- the menu is derived from your content types until you say otherwise, so add them under `nav:` in config/site.yml if they belong there."
    pages_and_more: " and %{count} more"
    ssg_hugo_site_root: "The folder you named is a Hugo site rather than a tree of posts, so content/ was imported and the rest of it -- layouts, archetypes, the built copy -- was left alone. If something you wanted lives outside content/, point the import straight at that folder."
    ssg_hugo_site_root_declined: "The folder you named holds Hugo's configuration, but it also holds markdown of its own at the top (%{files}) -- so it was walked whole rather than read as a site, and layouts/ and archetypes/ came along with content/. If those files are not posts, point the import at content/ instead."
    ssg_images_freed: "%{count} image(s) sat inside a line of text, where a post cannot show them -- each was moved onto a line of its own, and a picture that was only a link's decoration became the link's text."
    ssg_liquid_links_dropped: "%{count} link(s) were addressed through Liquid ({{ site.repository }}, {% link %}, {% post_url %}) -- an address that means nothing outside Jekyll. The words were kept and the address dropped, rather than left pointing at a page of this blog that was never there."
    ssg_media_missing: "%{count} image(s) named a file the tree does not have. Each kept its place in its post, with its alt text and caption, pointing at the missing name -- only the file itself is absent, and the build will say so until it arrives in the post's media folder."
    ssg_slug_collisions: "%{count} address(es) were claimed by more than one file -- a Hugo tree that kept both the flat post and the page bundle it grew into, or the same article filed twice. All of them were imported and the later ones got \"-2\" on the end, so nothing was lost; go through those pairs and delete the one you don't want."
    ssg_author_dropped: "%{count} post(s) named an author in their front matter. This engine is single-author by design and has no field for one, so the name did not come across -- if the archive holds somebody else's writing, credit them in the text before you publish."
    substack_paid: "%{count} post(s) were subscribers-only on Substack -- imported in full (the export is yours) and tagged \"substack-paid\", so you can find them before you publish."
    facebook_crossposts: "%{count} post(s) were crossposts from other platforms (Twitter, Posterous, ...) -- skipped so they don't duplicate those platforms' own imports. FACEBOOK_CROSSPOSTS=1 includes them."
    facebook_untouched: "The export also holds things outside the timeline, which this import does not take: uncategorised photos (%{photos}), albums (%{albums}) and videos (%{videos}). They stay in the downloaded export -- an album is not a post, and making one post per photo would bury the timeline."
    feed_ampersands_escaped: "%{count} stray \"&\" character(s) made this file invalid XML -- escaped, so it could be read at all. Text inside CDATA, where the post bodies live, was left exactly as exported."
    feed_controls_dropped: "%{count} control character(s) XML does not allow were dropped so the file could be read."
    feed_unmapped: "%{count} post(s) had no usable original address (plain \"?p=123\" permalinks have their identity in the query string) -- imported without a redirect."
    feed_unmapped_pages: "%{count} page(s) had no usable original address (plain \"?page_id=12\" permalinks have their identity in the query string) -- imported without a redirect."
    feed_pages_home: "%{count} page(s) already sit at the address they had on the old site, so they need no redirect -- moving to the same domain, their links keep working as they are."
    feed_pages_reserved: "%{count} page(s) came across on addresses this engine uses for itself (%{paths}) -- the build will not put them up until they are renamed, so do not list them under `nav:` as they stand."
    feed_dropped: "Content the block schema has no shape for was dropped from post bodies: %{listed}. Embeds and forms are the usual ones -- if a post needs its video, put the link back by hand."
    duplicate_ids: "%{count} item(s) in the source carried an id another item had already used. Each is written as a post of its own rather than over the first one -- look at them and delete whichever is the copy."
    feed_linked_images: "%{count} picture(s) were wrapped in a link, which an image block cannot carry -- the pictures arrived, the addresses they pointed at did not."
    ghost_scheduled: "%{count} post(s) were scheduled in Ghost -- imported as drafts; schedule them here when you're ready."
    ghost_members: "%{count} post(s) were members-only in Ghost -- imported as drafts tagged ghost-members; decide yourself which of them the public archive gets."
    livejournal_nonpublic: "%{count} entr(y/ies) were friends-only or private -- imported as drafts, they were never public."
    medium_responses: "%{count} post(s) looked like responses to other people's articles -- imported as drafts for review."
    medium_untagged: "%{count} published post(s) came without tags."
    movabletype_comments: "%{count} comment(s)"
    movabletype_pings: "%{count} trackback(s)"
    movabletype_and: " and "
    movabletype_left_behind: "The export also held %{parts} -- a static archive has nowhere to put them, so they were left behind."
    movabletype_textile: "%{count} post(s) are written in Textile (CONVERT BREAKS: textile_2). Their paragraphs came out right, but Textile's own markup -- h2., \"text\":url, *bold* -- was imported as written."
    podcast_media_size: "The episodes add up to ~%{size} to download and host."
    threads_replies: "%{count} repl(y/ies) to other people's threads were skipped -- an archive holds your own standalone posts."
    threads_html_replies: "The HTML page does not mark replies, so this import could not tell them apart -- an account with replies is better imported from JSON, which marks and skips them."
    tumblr_unmapped: "%{count} post(s) had no usable original address -- imported without a redirect."
