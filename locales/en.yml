    wayback_cdx_truncated: "⚠️  The Archive returned exactly the limit (%{limit}) of captures, so it almost certainly holds more and the rest was never read: %{list}. CDX answers oldest first, so what is missing is the END of the blog, not its beginning. Run the import one span at a time with --from/--to."
