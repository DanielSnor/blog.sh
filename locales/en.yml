  build_failed: "\n❌ Build failed -- nothing was deployed, so the site still shows what it showed before. Your content on disk is untouched; fix the reason above and run ./blog.sh rebuild, which builds and uploads in one go."
  deploy_failed: "\n❌ Deploy failed. The site was rebuilt; the reason is above. A transfer that broke off only needs ./scripts/deploy-web.sh again -- a guard that stopped the upload will stop it the same way until you do what it asks."
