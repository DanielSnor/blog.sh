# locales/en.yml -- default/fallback locale. Every key here MUST exist,
# since lib/i18n.rb falls back to this file for any key missing from the
# site's selected locale. Other locales may be partial.

# strftime formats for every server-rendered date (post date badges, the
# search index, sidebar widget JSON, CLI messages). The client-side
# counterpart is js.date_locale below -- keep the two consistent so
# build-time and runtime dates read the same.
thousands_separator: ","
decimal_point: "."
date_format: "%b %-d, %Y"
date_time_format: "%b %-d, %Y %H:%M"

nav:
  all: "All"
  text: "Text"
  quotes: "Quotes"
  chat: "Chat"
  images: "Images"
  video: "Video"
  links: "Links"
  audio: "Audio"
  documents: "Documents"
  menu_label: "Menu"
  search_label: "Search"
  search_placeholder: "Search…"

post:
  reading_time: "%{minutes} min read"
  reading_minutes: "%{minutes} min"
  toc_heading: "On this page"
  toc_label: "Table of contents"
  series_part: "Part %{number} of %{total} of %{name}"
  series_previous: "← %{title}"
  series_next: "%{title} →"
  comments_heading: "Comments"
  back_to_list: "← back to list"
  read_more: "Read more"
  video_unavailable: "[video unavailable]"
  audio_unavailable: "[audio unavailable]"
  draft_title_prefix: "[PREVIEW] "
  draft_banner_heading: "Preview of an unpublished post!"
  draft_banner_notice: "Not visible anywhere on the blog and can't be reached except through this URL:"

pagination:
  newer: "← Newer"
  older: "Older →"
  latest: "latest"
  page: "page %{number}"

tag:
  feed_title: "%{name} – %{site_title}"
  # The listing heading shows the tag itself; this is the word that says
  # what kind of listing it is, kept for screen readers and hidden from
  # sight by default (see .listing-heading__kind in site.css).
  kind: "Tag"
  title: "Tag: %{name} – %{short_name}"
  description: "Posts tagged %{name} on %{author}'s personal site."

series:
  kind: "Series"
  title: "%{name} – %{short_name}"
  description: "The series %{name} on the personal site of %{author}, in reading order."

type:
  text: "Text"
  quote: "Quotes"
  chat: "Chat"
  image: "Images"
  video: "Video"
  audio: "Audio"
  link: "Links"
  document: "Documents"
  title: "%{label} – %{short_name}"
  description: "Posts of type %{label} on %{author}'s personal site."

index:
  empty: "No posts of this type yet."

search:
  # Doubles as the page's own heading when no query has been typed yet.
  kind: "Search"
  tagline: "Searches across all post types — accent-insensitive."
  tip: "Tip: more than one word means all must match;<br>put an exact phrase in quotes (“…”);<br>exclude a word with a minus (-word)."
  prompt: "Type a query."
  page_title: "Search – %{site_title}"
  page_description: "Full-text search across posts, accent-insensitive."

not_found:
  heading: "Nothing here"
  body: "This address does not point at anything on this site -- it may have been mistyped, or it may have been something that has since moved. The menu above and the search box are the way on."
  page_title: "Nothing here – %{site_title}"
  page_description: "The page this address points at does not exist."

markdown_page:
  default_title: "Markdown"
  description: "Guide to the syntax this blog uses for writing posts."

ui:
  scroll_top: "Up"

# Consumed client-side via window.BLOG_I18N (see client_i18n_json in
