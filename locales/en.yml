poster:
  # What the author is told when an announcement did not go out. These are
  # the outcome of something they just did -- pressing [t], or publishing --
  # so a person reads them, in the CLI, in their own language. The
  # diagnostics underneath (HTTP codes, exception text) stay English: those
  # are for whoever is asked to look at it, and a translated status line
  # helps nobody search for it.
  no_mastodon_token_post: "MASTODON_ACCESS_TOKEN is not set, the toot was not created."
  no_mastodon_token_delete: "MASTODON_ACCESS_TOKEN is not set, the toot was not deleted."
  no_bluesky_password_post: "BLUESKY_APP_PASSWORD is not set, the Bluesky announcement was not posted."
  no_bluesky_password_delete: "BLUESKY_APP_PASSWORD is not set, the Bluesky announcement was not deleted."
  stats_fetch_failed: "Fetching the stats failed (%{key}): %{message}"
  # The rest of what the two posters say when a network refuses them. Each
  # line frames a diagnostic that stays as the server or Ruby wrote it:
  # %{error} is an exception message, %{code} an HTTP status, %{body} the
  # answer itself. The sentence around it is what a person reads; what is
  # inside it is what they paste to whoever is asked to look.
  mastodon_api_error: "Mastodon API returned %{code}: %{body}"
  mastodon_api_error_delete: "Mastodon API returned %{code} while deleting the toot: %{body}"
  mastodon_post_failed: "Posting to Mastodon failed: %{error}"
  mastodon_delete_failed: "Deleting the toot failed: %{error}"
  mastodon_id_unreadable: "Can't determine the toot ID from URL %{url}, it was not deleted."
  bluesky_post_failed: "Posting to Bluesky failed: %{error}"
  bluesky_no_record_address: "Posting to Bluesky failed: the server answered without a usable record address (%{answer})"
  bluesky_delete_failed: "Deleting the Bluesky announcement failed: %{error}"
  bluesky_uri_unreadable: "Can't parse the at:// URI %{uri}, the announcement was not deleted."
  bluesky_check_failed: "Could not check Bluesky for an existing announcement: %{error}"

