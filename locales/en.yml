# locales/en.yml -- default/fallback locale. Every key here MUST exist,
# since lib/i18n.rb falls back to this file for any key missing from the
# site's selected locale. Other locales may be partial.

# strftime formats for every server-rendered date (post date badges, the
# search index, sidebar widget JSON, CLI messages). The client-side
# counterpart is js.date_locale below -- keep the two consistent so
# build-time and runtime dates read the same.
thousands_separator: ","
decimal_point: "."
date_format: "%b %-d, %Y"
date_time_format: "%b %-d, %Y %H:%M"

nav:
  all: "All"
  text: "Text"
  quotes: "Quotes"
  chat: "Chat"
  images: "Images"
  video: "Video"
  links: "Links"
  audio: "Audio"
  documents: "Documents"
  menu_label: "Menu"
  search_label: "Search"
  search_placeholder: "Search…"

# The build's own voice -- what it says when it finishes and what it says
# when the archive cannot be built at all.
build:
  unreadable_posts: "❌ Unreadable post file(s) in content.nosync/posts/ -- build stopped:"
  duplicate_address: "❌ Two posts at one address in content.nosync/posts/ -- build stopped:"
  # Every count is a labelled one -- "posts: 1" rather than "1 posts" --
  # because the engine's I18n has no plural forms and is not getting any.
  # A sentence that has to decline the noun reads wrong in every language
  # at some number; a label and a colon reads right at all of them.
  summary: "Built into %{dir} -- posts: %{posts}, listing pages: %{pages}, tag pages: %{tags}, plus a search index, RSS feed and sitemap"
  drafts: "Drafts in progress (preview only, not in any listing): %{count}"
  reused: "Pages already up to date, not rebuilt: %{count}"
  full: "Full build -- every page rendered and compared."
  two_pages: "⚠️  %{count} posts are served at /%{slug}/ -- only one of them is:"
  two_pages_fix: "   The site still builds and the OLDER one keeps the address; the other stays\n   in the sitemap and in search, pointing readers at text that is not its own.\n   Give one of them another slug (./blog.sh props -> address)."
  # What the build says about the things it refused to build, in the order
  # it meets them. All of them fire on real archives -- an import brings
  # the redirect lists, a hand-edited JSON brings the rest -- and each one
  # names the post it is about, because the build goes on without it.
  extra_css_offsite: "⚠️  site.extra_css: %{value} is not a path on this site, so the page's Content-Security-Policy would discard it -- skipped. Copy the file into assets/ and name it as /assets/css/<name>.css."
  page_reserved_name: "⚠️  Page '%{slug}' would sit on an address the engine already uses (/%{slug}/) -- not built. Rename it."
  draft_no_token: "⚠️  Draft '%{slug}' has no draft_token -- its preview would be at a guessable address, so it is not built. Re-save it with ./blog.sh edit."
  pinned_more_than_one: "⚠️  More than one post is pinned; using the newest (%{slug})."
  tag_too_long: "⚠️  Tag \"%{name}…\" is too long for a listing page's address -- it shows on its posts, but no /tag/ page is built for it."
  series_too_long: "⚠️  The series %{name} has a name too long for an address, so it gets no listing page. Everything else about the series works; give it a shorter name if you want one."
  page_size_unusable: "⚠️  site.page_size is %{value}, which nothing can page by -- a whole number greater than zero is what this needs. Building with 10; `./blog.sh doctor` says the same thing about it."
  archive_span_absurd: "⚠️  The archive runs from %{from} to %{to} -- almost certainly a typo rather than a date. The map therefore shows only the years that hold something; fix the date and the empty years come back."
  former_slug_unusable: "⚠️  %{slug}: unusable former_slugs entry %{entry} -- expected \"year/slug\"."
  former_slug_taken: "⚠️  %{slug}: redirect for %{former} skipped -- that address is already taken (a live page, or an earlier post's redirect)."
  redirect_from_unusable: "⚠️  %{slug}: unusable redirect_from entry %{entry} -- expected a site-root path like \"/old-post/\"."
  redirect_from_reserved: "⚠️  %{slug}: redirect_from %{entry} skipped -- /%{segment}/ belongs to the site itself."
  redirect_from_taken: "⚠️  %{slug}: redirect_from %{origin} skipped -- that address is already taken (a live page, a site file, or an earlier redirect)."
  redirect_from_directory: "⚠️  %{slug}: redirect_from %{origin} skipped -- an earlier redirect already made a directory of that address."
  # The commonest of them on a real archive, and the last one that was
  # still a literal in the build: a post naming a picture its media folder
  # does not hold. Every import that met a dead image host leaves some.
  media_missing: "⚠️  %{slug}: names a media file its folder does not hold -- %{filename}. The page still links it, so that address stays a 404 until the file arrives."
  # Not an archive's doing at all: the cheat sheet ships with the engine.
  cheat_sheet_missing: "⚠️  %{path} is missing -- the /markdown/ cheat sheet page is not built. It ships with the engine; a pull that went wrong is the usual reason."
  # The tail of the sign-off, counted the labelled way like everything
  # above it.
  pruned: "Files that nothing generates any more, removed: %{count}"

