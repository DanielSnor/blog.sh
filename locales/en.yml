# ./blog.sh doctor -- reads the configuration on disk and reports what is
# wrong with it (lib/doctor.rb). Every "fix" line has to be actionable on
# its own: it is read by someone who does not know which file the setting
# lives in, let alone which key.
doctor:
  heading: "Checking this install"
  running_online: "Checking hosts and tokens too (--online)"
  summary: "%{errors} problem(s), %{warnings} worth a look, %{oks} fine."
  summary_clean: "No problems. %{oks} check(s) passed."
  hint_online: "Add --online to also check that the feeds, the analytics script and the access token still answer."

  env_ok: "env.sh is there and only you can read it."
  env_missing: "There is no env.sh, so no tokens and no deploy target are configured."
  env_missing_fix: "Run ./setup.sh, or copy it by hand: cp env.sh.example env.sh && chmod 600 env.sh"
  env_mode: "env.sh is mode %{mode} -- other users on this machine can read your tokens."
  env_mode_fix: "chmod 600 env.sh"

  site_yml_ok: "config/site.yml parses."
  site_yml_missing: "There is no config/site.yml, so nothing can be built."
  site_yml_missing_fix: "Run ./setup.sh, or copy the documented template: cp config/site.yml.example config/site.yml"
  site_yml_empty: "config/site.yml is empty, or is not a set of settings."
  site_yml_syntax: "config/site.yml is not valid YAML: %{message}."
  site_yml_unreadable: "config/site.yml exists but cannot be read: %{message}."
  site_yml_unreadable_fix: "Check the file's owner and permissions (ls -l config/site.yml). Usually: chmod 644 config/site.yml — and if the file is owned by root after a wizard ran under sudo, chown it too."
  site_yml_syntax_fix: "Look at line %{line}, column %{column}. Almost always this is indentation (spaces only, never tabs), a missing quote, or a colon inside an unquoted value."

  identity_ok: "The site's identity is filled in."
  key_missing: "%{key} is missing from config/site.yml."
  base_url_missing: "The site has no address -- RSS, the sitemap and every share preview need one."
  base_url_missing_fix: "Set site.base_url in config/site.yml, or SITE_BASE_URL in env.sh."
  base_url_placeholder: "The site's address is still the example's https://example.com."
  base_url_placeholder_fix: "Fine while you are only looking at it locally. Set the real one before you deploy, or every link the site publishes about itself points at example.com."
  base_url_shape: "The site's address (%{value}) is not a URL."
  base_url_shape_fix: "It has to start with http:// or https:// and carry a host name."
  base_url_slash: "The site's address (%{value}) ends with a slash, which produces doubled slashes in generated links."
  base_url_slash_fix: "Drop the trailing slash."
  page_size: "site.page_size is %{value}; it has to be a whole number greater than zero."

  placeholders: "Still the example's text: %{keys}."
  placeholders_fix: "Harmless locally, but this is what visitors would read. ./style.sh asks for the bio, the footer and the links."

  lang_unknown: "site.lang is \"%{lang}\", and there is no locales/%{lang}.yml to go with it."
  lang_unknown_fix: "Available: %{available}. To add another, see docs/localization.md."

  timezone_ok: "Timestamps are written in %{zone}."
  timezone_unknown: "site.timezone \"%{zone}\" is not a timezone this machine knows."
  timezone_unknown_fix: "Use an IANA name like Europe/Prague or America/New_York (see /usr/share/zoneinfo), or UTC. A typo here would silently date every post wrong."

  no_network: "No comments network configured -- posts are not announced anywhere."
  both_networks: "Both mastodon: and bluesky: are configured, and the build refuses that."
  both_networks_fix: "Comments and the announcement post live on exactly one network. Comment out the section you do not want."
  mastodon_instance_shape: "mastodon.instance is \"%{value}\" -- it takes a host name only, with no https:// and no path."
  mastodon_ok: "Announcing to %{instance}."
  mastodon_token_missing: "mastodon: is configured but MASTODON_ACCESS_TOKEN is empty, so nothing is ever announced."
  mastodon_token_missing_fix: "Create one on the instance under Preferences -> Development -> New application, scope write:statuses, and put it in env.sh."
  toot_length: "mastodon.toot_length is %{value}; it has to be a whole number greater than zero."
  bluesky_ok: "Announcing as %{handle}."
  bluesky_password_missing: "bluesky: is configured but BLUESKY_APP_PASSWORD is empty, so nothing is ever announced."
  bluesky_password_missing_fix: "Settings -> App Passwords on Bluesky. An APP password, never the account password. Put it in env.sh."

  banner_ok: "The banner image is there and its declared size matches the file."
  banner_default: "Still the banner the engine ships with."
  banner_missing: "The banner image %{path} is not there, so every page will show a broken image."
  banner_missing_fix: "Put the file where banner.src points, or change banner.src."
  banner_dimensions: "The banner is declared %{declared} but the file is %{actual}, so the page jumps as it loads."
  banner_dimensions_fix: "Set banner.width to %{width} and banner.height to %{height}."

  colors_ok: "The palette is complete and every value is a colour."
  colors_missing: "The %{mode} palette is missing %{keys}; those fall back to the engine's blue."
  colors_missing_fix: "Either set all seven, or omit the section entirely -- a half-set palette mixes two designs."
  colors_hex: "colors.%{mode}.%{key} is %{value}, which is not a colour."
  colors_hex_fix: "Values look like \"#1da1f2\" or \"#fff\" -- with the quotes, or YAML reads the # as a comment."

  fonts_ok: "Every font file named in the config is in assets/fonts/."
  fonts_missing: "Named in the config but not in assets/fonts/: %{files}."
  fonts_missing_fix: "The site renders in the fallback font, which looks exactly like the config not working. Put the file there, or drop it from fonts.faces."

  extra_css_ok: "Extra stylesheet(s): %{count}, every one a path on this site and present."
  nav_ok: "Menu: %{count} item(s), every one of them pointing at something."
  nav_tag_missing: "The menu item \"%{label}\" points at the tag %{tag}, which no post carries."
  nav_tag_missing_fix: "Its listing is not built, so the item is a 404 in your own menu. Usually the last post with that tag was unpublished or retagged. Fix the tag or drop the item."
  nav_url_missing: "The menu item \"%{label}\" points at %{url}, which this site does not answer at."
  nav_url_missing_fix: "Usually a post that was renamed or deleted after the menu was written. Point it somewhere that exists, or drop it -- an address off this site is left alone here, that is check --online's question."
  nav_url_relative: "The menu item \"%{label}\" points at %{url}, which is not an address but a name read against whatever page it is on."
  nav_url_relative_fix: "From the front page it may even work; from a post it lands beside the post. Write it with the slashes: %{url}"
  extra_css_remote: "site.extra_css names %{value}, which lives on another host."
  extra_css_remote_fix: "Every page carries style-src 'self', so the browser discards it and the site renders undressed -- with no error anywhere you would see one. Copy the file into assets/ and name it /assets/css/<name>.css."
  extra_css_missing: "site.extra_css names %{value}, which is not in the tree."
  extra_css_missing_fix: "The page asks for it, gets a 404 and renders without it, which looks exactly like a stylesheet that does nothing. Put the file there, or drop the line."

  widgets_ok: "%{count} sidebar widget(s), all filled in."
  widget_shape: "The %{name} widget is not a set of settings."
  widget_incomplete: "The %{name} widget has no %{key}, so it can never show anything."
  widget_account_id: "The toots widget wants a numeric account id and has %{value}."
  widget_account_id_fix: "Not the @handle -- the number. Open your profile's RSS (https://instance/@you.rss) or ask the instance's API; ./setup.sh looks it up for you."
  widget_heading: "The %{name} widget has no heading, so it appears without a title."
  widget_limit: "The %{name} widget's limit is %{value}; it has to be a whole number greater than zero."

  slots_ok: "%{count} publishing slot(s)."
  slots_shape: "publishing.slots has to be a list."
  slots_bad: "Publishing slots that will be ignored: %{values}."
  slots_bad_fix: "The format is \"<day> HH:MM\" -- mon, tue, wed, thu, fri, sat, sun or daily, then a 24-hour time. Full day names do not work."
  scheduler_ok: "The queue has %{count} post(s) waiting and something ran it %{ago} ago."
  scheduler_never: "%{count} post(s) are waiting in the queue, but nothing has ever run it here -- they will not publish on their own."
  scheduler_stale: "Nothing has run the queue for %{ago}, and %{count} post(s) are waiting -- it runs every fifteen minutes when it runs at all."
  scheduler_fix: "Schedule scripts/publish-scheduled.sh -- every fifteen minutes is what the wizard's times assume (*/15 * * * * /path/to/blog/scripts/publish-scheduled.sh). On a hosted install the panel's own cron section is the place; check that its path points at THIS blog and not another one."
  age_minutes: "%{count} minute(s)"
  age_hours: "%{count} hour(s)"
  age_days: "%{count} day(s)"

  media_location_clean: "No photo in the archive carries the place it was taken."
  media_location: "%{count} photo(s) in the archive still carry the place they were taken -- saved before the engine started removing it, and the site shows what the archive holds."
  media_location_fix: "./blog.sh doctor --strip-location removes it. New photos are already handled; set media.strip_location to false in config/site.yml if you want the coordinates kept."
  media_location_no_dir: "There is no media.nosync directory yet, so there is nothing to clean."
  media_location_stripping: "Removing the location from %{count} photo(s)…"
  media_location_stripped: "Cleaned %{count} photo(s)."
  media_location_unwritable: "%{count} could not be rewritten -- check the file permissions and run this again."
  media_location_redeploy: "Each rewritten photo has a new checksum, so the next deploy uploads it again. Run ./blog.sh rebuild when you're ready."
  backend_unset: "No deploy target chosen, so the site is built locally and goes nowhere."
  backend_unset_fix: "That is a fine place to start -- ./blog.sh preview shows the build. Run ./setup.sh when you want it online."
  backend_ok: "Deploying with the %{name} backend."
  backend_unknown: "DEPLOY_BACKEND is \"%{name}\", which is not a backend this engine has."
  backend_unknown_fix: "Known backends: %{known}."
  backend_incomplete: "The %{name} deploy backend is missing %{values}, so deploys upload nothing."
  backend_incomplete_fix: "Deploys say so and exit cleanly, which is what a local-only install wants -- set the values in env.sh when you want the site online."

  widget_label: "the %{name} widget's feed"
  analytics_label: "the analytics script"
  online_ok: "%{label} answers."
  online_failed: "%{label} (%{url}) did not answer: %{message}."
  token_ok: "The access token works -- %{handle}."
  token_invalid: "%{instance} rejected the access token."
  token_invalid_fix: "Nothing has been announced since it stopped working, and nothing will be until it is replaced. Create a new one and put it in env.sh."
  token_invalid_bluesky_fix: "Make a fresh app password in Bluesky (Settings -> Privacy and security -> App passwords) and put it in env.sh as BLUESKY_APP_PASSWORD."
  token_unchecked: "Could not check the token against %{instance} (%{code})."

# ./setup.sh -- the core setup wizard (scripts/setup.rb). Prompts are a
# label, a hint under it, and the pre-filled value. Hints explain what
# the setting does and, where the shape of an answer is not obvious, end
# with an example -- on a fresh install the "current value" is only the
# template's filler, so it cannot show the shape. Whether anybody
# actually chose the value is what the "Now:" vs. "Suggested:" line says
# (wizard.prompt_with_current / prompt_with_suggestion).
check:
  progress_online: "Asking the web: %{done}/%{total}"
  running_online: "Also checking links that leave this site -- this takes a while."
  online_ok: "All %{count} outside link(s) still answer."
  link_gone: "%{slug}: %{url} is gone (%{reason})."
  link_gone_fix: "Only hosts that no longer resolve and pages answering 404/410 are reported -- a timeout or a 5xx is \"not right now\" and is left alone. Fix the link, drop it, or point it at the Wayback Machine."
  reason_no_host: "the host does not exist"
  unknown_option: "Unknown option: %{option}. check takes --online, nothing else."
  heading: "Checking this archive"
  progress: "Reading posts: %{done}/%{total}"
  no_posts: "There are no posts to check yet."
  all_clear: "Nothing wrong inside the archive: %{posts} post(s), with media, links and redirects all checking out."
  media_missing: "%{slug}: the file %{file} is missing from its media directory."
  media_missing_fix: "The post asks for it and the page renders a hole. Usually an import whose download failed -- put the file there, or edit the post to drop it."
  image_degenerate: "%{slug}: the image %{file} is %{width}x%{height} and will not be rendered at all."
  image_degenerate_fix: "Anything 1px or smaller is treated as a tracking pixel and dropped WITH its caption, so the page silently loses both. Replace the image or remove the block."
  link_dead: "%{slug}: links to %{url}, which nothing on this site answers at."
  link_dead_fix: "Usually a permalink left over from an import, or a slug renamed before renames kept a redirect. Fix the link, or give the target post a redirect_from entry."
  media_orphan: "No post owns the media directory %{dir}."
  media_orphan_fix: "Left over from a deleted or renamed post, or an import that ran twice. Nothing links to it; delete it yourself once you have looked."
  redirect_collision: "%{origin} is claimed by more than one post: %{slugs}."
  redirect_collision_fix: "Whichever renders last wins and the others' readers land on it. Leave the entry on one post only."
  and_more: "...and %{count} more of the same kind, not listed."
  summary: "%{errors} problem(s), %{warnings} thing(s) worth a look."
  summary_clean: "The archive is sound."

stats:
  unknown_option: "Unknown option: %{option}. stats takes --json, nothing else."
  no_posts: "There is nothing to count yet."
  heading_archive: "The archive"
  heading_years: "By year"
  heading_types: "What they are"
  heading_words: "Words"
  heading_tags: "Tags"
  heading_media: "Media"
  heading_sources: "Where it came from"
  archive_line: "%{total} post(s): %{published} published, %{drafts} draft(s), %{scheduled} scheduled, %{pages} page(s)"
  span_line: "%{first} - %{last}, which is %{days} days"
  busiest_line: "the busiest year was %{year} (%{count} posts)"
  words_line: "%{total} words in all, %{mean} per post on average, %{median} in the middle"
  longest_line: "longest: %{slug} (%{words} words)"
  reading_line: "reading the whole archive takes %{hours} hours"
  reading_line_minutes: "reading the whole archive takes %{minutes} minutes"
  media_none: "no media at all"
  tags_line: "%{unique} different, %{per_post} per post"
  media_line: "%{files} file(s), %{size}, across %{posts} post(s)"
  media_referenced_line: "%{referenced} file(s) the posts ask for, across %{posts} post(s) -- media.nosync is not here"

export:
  heading: "Writing this archive out to %{path}"
  progress: "Writing posts: %{done}/%{total}"
  unknown_option: "Unknown option: %{option}. export takes a directory, --no-drafts, --dry-run and --force."
  target_not_empty: "%{path} is not empty."
  target_not_empty_fix: "Give an empty directory, or repeat with --force to write alongside what is already there. Nothing is deleted either way."
  dry_run_notice: "Dry run: everything is counted, nothing is written."
  no_drafts_notice: "Drafts are staying home -- only published posts and pages are going out."
  no_posts: "There is nothing to export yet."
  summary: "Written to %{path}: %{posts} post(s), %{drafts} draft(s), %{pages} page(s), and %{media} media file(s) (%{size})."
  summary_dry: "Would write to %{path}: %{posts} post(s), %{drafts} draft(s), %{pages} page(s), and %{media} media file(s) (%{size})."
  fallback_note: "%{count} block(s) markdown has no syntax for were written as HTML: %{kinds}. Any engine that passes HTML through renders them, and this engine reads them back whole -- each one carries its own definition in a comment above it, which everybody else ignores."
  collisions: "%{count} file(s) were renamed so they would not overwrite each other -- two posts asked for the same filename."
  next_steps: "The layout is Jekyll's: _posts/, _drafts/, pages at the root, media under assets/. Hugo, Eleventy and Astro read it with a line of config; ./import.sh reads it as it stands."

setup:
  intro: "This asks for the settings a site needs to work, checks the answers as it goes, and writes them into config/site.yml and env.sh."
  intro_skip: "Every question can be skipped -- Enter takes the value pre-filled under it. Nothing is written until you have seen all the changes together and said yes."
  intro_expert: "(Rather edit YAML yourself? The wizard only fills in config/site.yml, whose commented template is config/site.yml.example.)"

  section_identity: "Who the site is"
  section_address: "Where the site lives"
  section_network: "Where the comments live"
  section_deploy: "Where the site is published"

  q_title: "Full site title"
  h_title: "Shown in the browser tab and the basis of every page's title. E.g.: The Blue Notebook -- Petra's notes."
  q_short_name: "Short name"
  h_short_name: "A shortened form of the title for tight spots: the heading over the banner image and listing titles (\"Tag: garden -- Blue Notebook\"). E.g. just: Blue Notebook."
  q_description: "One-sentence description"
  h_description: "What the site is about. Shown on the banner, in link-share previews and in RSS readers. Plain text, no HTML -- e.g.: Writing about the garden, books and whatever makes me smile."
  q_author: "Author"
  h_author: "Your name or nickname, as it should appear in the RSS feed and the page metadata."
  q_timezone: "Timezone"
  h_timezone: "Publish times are calculated in this zone. An IANA name like Europe/Prague. Mind servers: the machine is often on UTC, but this should be the zone you live in."
  e_timezone: "This machine does not know a zone called \"%{zone}\". Zones are named Continent/City, in English -- Europe/Prague, not Praha or CEST; the full list is in /usr/share/zoneinfo."

  q_base_url: "Site address"
  h_base_url: "The address the site will be seen at, e.g. https://mysite.com -- no trailing slash. RSS, the sitemap and share previews are built from it. Written to config/site.yml and env.sh at once, so the two copies cannot drift apart."
  e_base_url: "That is not a URL -- it has to start with http:// or https:// and carry a host name."
  e_base_url_slash: "Drop the trailing slash, or generated links end up with two."

  section_network_intro: "blog.sh has no comment box of its own. Instead, every new post is announced on your social network account, and replies to that announcement show up under the post as its comments. So you are picking the network where you already have an account (or will make one)."
  q_network: "Which network carries the comments?"
  network_mastodon: "Mastodon -- each post is announced there, and the replies are its comments"
  network_bluesky: "Bluesky -- the same arrangement, on Bluesky"
  network_none: "Neither -- no announcements, no comments, no post statistics"
  network_off: "No network. Posts are published without being announced anywhere."

  q_instance: "Mastodon instance"
  h_instance: "Just the name of the server your account is on -- mastodon.social, not https://mastodon.social/@you."
  e_instance: "The host name only, with no https:// and no path."
  token_where: "The token is the key that lets the blog post announcements in your name. Make one on %{instance}: Preferences -> Development -> New application, tick the write:statuses scope, and copy the access token here."
  q_token: "Access token (Enter to skip -- it is not shown as you type): "
  token_skipped: "No token. The site works; it just never announces anything until you add one to env.sh."
  checking_token: "Asking the instance whether the token works"
  token_ok: "✅ The token works -- %{handle}."
  token_rejected: "The instance rejected that token."
  token_unchecked: "Could not check the token (%{code})."
  token_kept_anyway: "Saved anyway -- a host being unreachable now says nothing about whether the token is right."
  token_kept_rejected: "Saved, but nothing will be announced until it is replaced. Make a new one and run ./setup.sh again."

  q_toots_widget: "Show your latest toots in the sidebar? The account id (%{id}) is right here, so this costs nothing. [y/N] "
  toots_heading: "Recent toots"
  toots_added: "✅ Added. ./scripts/refresh-sidebar.sh fills it in; run it from cron to keep it fresh."

  q_handle: "Bluesky handle"
  h_handle: "Without the @ -- you.bsky.social."
  e_handle: "Just the handle: no @ at the front and no URL."
  q_app_password: "App password (Enter to skip -- it is not shown as you type): "
  password_skipped: "No app password. The site works; it just never announces anything until you add one to env.sh."

  section_deploy_intro: "The built site is an ordinary folder of files; this picks where ./blog.sh rebuild uploads it after every change. Go by where the site will run -- and if you don't know yet, keep the first option. It can be changed any time by running ./setup.sh again."
  q_backend: "Where should the built site go?"
  backend_none: "Nowhere yet -- write and preview locally, decide later"
  backend_surfer: "Cloudron Surfer -- you run your own Cloudron with the Surfer app on it"
  backend_local: "A directory on this machine -- a web server (nginx, Caddy...) runs right here"
  backend_rsync: "rsync -- your own server, the one you log into over SSH"
  backend_git: "GitHub/GitLab/Codeberg Pages -- the git host serves the site for free"
  backend_rclone: "rclone -- cloud storage like S3, R2, B2 or WebDAV"
  backend_sftp: "SFTP -- classic web hosting, uploaded to over SFTP"
  backend_skipped: "No deploy target. Builds stay local; ./blog.sh preview shows them."

  q_surfer_url: "Surfer app URL"
  h_surfer_url: "The address the Surfer app runs at -- the same one the site's visitors will see. E.g. https://blog.mydomain.com."
  surfer_token_where: "Surfer issues the token in its web interface: log into the app and open Settings -> Access Tokens."
  q_surfer_token: "Surfer access token (not shown as you type): "
  q_surfer_remote_dir: "Subdirectory on Surfer"
  h_surfer_remote_dir: "Fill in only if the site should live in a subfolder next to something else. Enter = the site sits right at the app's address."
  q_deploy_target_dir: "Directory"
  h_deploy_target_dir: "The absolute path of the folder your web server shows the world -- the build is copied into it. E.g. /var/www/mysite."
  q_rsync_target: "rsync destination"
  h_rsync_target: "Write what you would give rsync: user@server:/var/www/mysite, or a local path."
  q_git_pages_remote: "Git remote"
  h_git_pages_remote: "The repository the built site is pushed to and Pages serves from. E.g. git@github.com:you/site.git."
  q_git_pages_branch: "Branch"
  h_git_pages_branch: "The branch the site is force-pushed to. gh-pages is the usual answer."
  q_rclone_target: "rclone destination"
  h_rclone_target: "remote:path, e.g. r2:my-bucket/site. Credentials live in rclone's own configuration (rclone config)."
  q_sftp_target: "SFTP host"
  h_sftp_target: "user@server -- the login and address your hosting gave you."
  q_sftp_remote_dir: "Remote directory"
  h_sftp_remote_dir: "The folder on the server the hosting shows the world -- often www or public_html."
  target_ok: "✅ %{dir} exists."
  target_missing: "%{dir} does not exist yet. Create it before the first deploy, or the deploy will have nowhere to put the site."

  env_permissions: "%{path} holds live credentials and is readable only by you (mode 600)."
  next_steps: "Next: ./blog.sh add writes your first post, ./blog.sh preview shows the site at http://localhost:8000/, and ./style.sh sets the palette, the header image and the sidebar."
