  lightbox_label: "Image viewer"
  lightbox_open: "Open image"
  copy_code: "Copy text"
  copied: "Copied"
  copy_failed: "Could not copy"

# scripts/manage_post.rb (the ./blog.sh authoring CLI/wizard) and its
# frontmatter-editor hint text. cancel_word is compared against user input
# (downcased) -- if you translate it, users must type the translated word to
# cancel a wait loop.
cli:
  cancel_word: "cancel"
  confirm_word: "yes"
  missing_images_wait: "Missing %{count} image(s), waiting for you to upload them to incoming/:"
  missing_images_prompt: "Press Enter once uploaded (or type \"%{cancel_word}\" to abort): "
  missing_images_eof: "No input left to read (stdin is closed), so the missing files can't arrive. Nothing was saved.\n\n"
  cancelled_nothing_saved: "Cancelled, nothing was saved.\n\n"
  unreadable_post: "⚠️  Skipping unreadable post file %{path}: %{error}"
  editor_buffer_kept: "Your text was not lost -- it is in %{path}, and the next add/edit offers to bring it back."
  buffer_found: "📝 There is text from an interrupted %{what}%{when}: %{lines} line(s), starting “%{preview}”."
  buffer_found_when: ", %{time}"
  buffer_unknown_origin: "an earlier session"
  buffer_belongs_elsewhere: "It belongs to %{command} -- restoring it anywhere else would make a different post out of it."
  buffer_prompt: "[r] restore it into this editor  [d] discard it  [c] continue without it: "
  buffer_prompt_foreign: "[d] discard it  [c] continue without it: "
  buffer_restored: "Restored -- the editor opens with that text."
  buffer_discarded: "Discarded."
  buffer_kept_for_now: "Left in %{path} -- writing anything in this session replaces it."
  buffer_still_kept: "Nothing changed, so the recovered text stays in %{path} -- the next add/edit offers it again."
  image_dimensions_unknown: "⚠️  %{file}: the image size could not be read, so the page cannot reserve space for it and may jump while loading. PNG, JPEG, GIF and WebP are always read."
  image_heic_hint: "   HEIC displays only in Safari -- convert it first: sips -s format jpeg FILE --out FILE.jpg (macOS), heif-convert FILE FILE.jpg (Linux)."
  frontmatter_date_invalid: "❌ Cannot read the date %{value} -- expected YYYY-MM-DD [HH:MM]. Your text is kept in the buffer; reopen the post after fixing it."
  post_changed_while_editing: "❌ '%{slug}' changed on disk while you were editing it (the scheduled-publish cron publishes on its own). Nothing was saved, so nothing of that change was lost -- reopen the post and redo your edit on the current version."
  unknown_frontmatter_key: "❌ Unknown key in the header: %{keys}. I know: %{known}. A typo here would be silently dropped on save, so nothing was written -- your text is kept, see below."
  heic_refused: "❌ %{files}: HEIC displays only in Safari -- other browsers would show a broken image. Nothing was saved and the file stays where it is. Convert it first (%{command}), or set media.convert_heic: true in config/site.yml and the engine will convert it for you."
  heic_no_tool: "❌ %{files}: media.convert_heic is on, but no converter was found (tried sips, heif-convert, heif-dec, magick/convert, vips). Nothing was saved. Convert by hand: %{command}"
  heic_converted: "🔄 %{file} → %{target} (HEIC converted via %{tool})."
  heic_convert_failed: "❌ %{file}: HEIC conversion via %{tool} failed -- nothing was saved and the file stays where it is. Convert by hand: %{command}"
  media_too_large: "❌ %{files}: over the %{limit} per-file limit, which the strictest deploy target refuses -- nothing was saved and the file stays where it is. Shrink it, or leave it out of the post and link to it instead."
  media_large: "⚠️  %{files}: close to the %{limit} per-file limit. Saved -- but every reader pays for those bytes, so consider shrinking it."
  # A file arriving into a media directory under a name that is already
  # taken. The one in the way is moved aside rather than overwritten, and
  # named out loud, because nothing about a stray file says it is safe to
  # destroy. The "media:" prefix is the directory, not a word to translate.
  media_name_taken: "media: %{name} was already taken -- the file that was there is now %{moved}"
  video_hevc: "⚠️  %{files}: recorded as HEVC, which most browsers play but not all -- readers on the rest get an empty player instead of the video. Saved either way. Re-encoding it plays everywhere (needs ffmpeg -- `brew install ffmpeg` on a Mac):\n     %{command}"
  video_quicktime: "⚠️  %{files}: a QuickTime .mov container. The video inside is fine, but not every browser accepts the container; .mp4 is the one they all take. Saved either way. Repacking copies the video across untouched, no re-encoding (needs ffmpeg):\n     %{command}"
  embed_lookup_working: "🔎 %{url}: asking the service where its player is…"
  embed_lookup_failed: "⚠️  %{url}: no player found -- the service did not answer, or offers none for this address. Saved with a link to it instead; editing and saving again retries."

  double_frontmatter_error: |
    ❌ There's a second frontmatter header in the text.

    It looks like you pasted text that already had its own --- lines under
    the header that was already there. Only the first one is processed, so
    the post would end up without a title and get a slug derived from the
    first few words of the text instead.

    Keep only one header: either delete the empty one at the top, or remove
    the --- lines from the pasted text and copy its values into the one above.

  frontmatter_hint: |
    <!--
    GUIDE -- this block and lines starting with // are removed on save, they never end up in the post.
    (So write your own notes with //, not # -- hashes are reserved for headings.)

    FRONTMATTER (between --- and ---):
      title  heading (optional)
      tags   comma-separated tags, e.g: nature, hike, city
      type   post type -- text / quote / chat / image / video / audio / link
             (optional -- leave it blank and the type is inferred from the
             post's content)
             page -> a page: its own address, out of the listings, the
             archives and the feed (About, Contact)
      pinned true -> the post is held at the top of the first listing page
      unlisted true -> the post keeps its address but leaves the listings,
             the feeds, the sitemap and the search (a link for a few
             people, not a password)
      series name of a series; posts sharing a name form one
      hero   true/false -> lead image above the title for this post
      toc    true/false -> chapter list (appears by itself from four headings)

    Publish date isn't set here -- [p]ublish uses the moment you publish,
    [s]chedule asks for a future date/time when you pick it. To backdate,
    type a date: line into the header yourself -- publish will keep it.

    CONTENT goes under the second ---. For formatting syntax:

      Markdown Cheat Sheet -- %{cheat_sheet_url}
    -->

  template_unchanged: "Template left unchanged (not saved?), no post was created."
  empty_content: "Empty content, nothing was written."
  wrote_draft: "Written as draft: %{path}"
  incoming_not_cleaned: "Left in incoming/: %{files} — the copy is in the post, but the staged original could not be deleted (no write permission on incoming/). Remove it by hand, so an empty incoming/ still means nothing is pending."
  generating_preview: "Generating preview"
  draft_saved_preview_pending: "Draft is saved. The preview will show up after a successful deploy -- then run ./blog.sh edit %{slug}"

  base_url_missing_preview: "SITE_BASE_URL is not set, can't build the preview URL."
  preview_label: "Preview: %{url}"
  local_preview_hint: "The site goes nowhere yet -- run ./blog.sh preview and open %{url} (port 8000 by default)."
  template_body_placeholder: "First paragraph's text."
  deploy_backend_incomplete: "The %{name} deploy backend is not configured -- skipping the upload. The build in public.nosync/ is complete; view it with ./blog.sh preview. To actually deploy, set DEPLOY_BACKEND and its values in env.sh (see env.sh.example)."
  deploy_target_relative: "DEPLOY_TARGET_DIR is %{dir}, which is a relative path -- the whole site would go into a directory of that name inside the installation. env.sh.example and docs/install.md both show an absolute one (/var/www/mysite)."
  deploy_args_fix: "That line in env.sh most likely has an unmatched quote in it. Switches are written into it as plain text in quotes, for example \"-P 2022 -i /home/dan/.ssh/key\"."
  deploy_guard_shrink_files: "❌ Stopped: public.nosync/ has %{have} files, but %{expected} were expected from %{source}.\n   That is a %{percent}% drop -- looks like a broken build.\n   Check the build output. If the drop is expected (you deleted a lot of posts), run again with --force."
  deploy_guard_shrink_bytes: "❌ Stopped: public.nosync/ holds %{have}, but %{expected} were expected from %{source}.\n   The file count looks reasonable, so this is content going missing inside the pages rather than pages going missing.\n   Check the build output. If the drop is expected, run again with --force."
  deploy_guard_growth_files: "❌ Stopped: public.nosync/ has %{have} files, only %{expected} were expected from %{source}.\n   That is a %{percent}% increase -- looks like a duplicated or broken build.\n   Check the build output. If the increase is expected (a bulk import or migration), run again with --force."
  deploy_only_unknown: "❌ %{names}: not found in public.nosync/."
  deploy_ref_baseline: "the last accepted build (%{at})"
  deploy_ref_manifest: "the manifest (no accepted build recorded yet)"
  deploy_state_unwritable: "The upload itself went through; only the note about it could not be written -- most likely a full disk. The next run will therefore upload everything again; free some space and nothing else comes of it."
  # The rest of scripts/deploy_web.rb's narration. Counted lines are worded
  # so no language needs plural forms; the backend's own label and the
  # target address are interpolated raw, because they are what the tool
  # calls itself and what has to be typed back into env.sh.
  deploy_header: "Deploy web -> %{backend}: %{target}"
  deploy_public_missing: "❌ public.nosync/ does not exist -- run the build first (ruby build/build_blog.rb)."
  deploy_public_empty: "❌ Stopped: public.nosync/ is empty -- run the build first (ruby build/build_blog.rb)."
  deploy_file_vanished: "❌ %{name} disappeared from public.nosync/ mid-deploy -- run the build again."
  deploy_manifest_foreign: "⚠️  %{path} was written for %{was} -- this run deploys to %{now}.\n   Treating it as empty: everything will be uploaded, and orphans on the new target cannot be\n   found from here. That is the safe half of the mistake; the other half would be deleting them."
  deploy_manifest_unreadable: "⚠️  %{path} is unreadable (%{reason}) -- treating it as empty.\n   Everything will be re-uploaded. Files already on the target that this build no longer generates\n   can no longer be found automatically; check the target if you have deleted posts recently."
  deploy_baseline_unreadable: "⚠️  %{path} is unreadable (%{reason}) -- treating it as absent.\n   The growth guard has no reference for this one run; it is recorded again below."
  deploy_files_too_large: "❌ Stopped: files over the %{limit} per-file limit: %{count}.\n%{list}\n   One limit applies to every backend, so the site stays portable between them -- the strictest\n   supported target (git pages) refuses anything larger, and --force does not lift this: the\n   target would refuse the file on every run. Shrink it, or take it out of the post."
  deploy_stale_too_large: "⚠️  %{files} already on the target, over the %{limit} per-file limit -- this site can no longer be moved to a target that enforces it."
  deploy_large_files: "⚠️  Large files: %{files}%{more} -- under the %{limit} limit, but every reader pays for those bytes."
  deploy_large_files_more: " and %{count} more"
  deploy_growth_notice: "⚠️  The build grew from %{was} to %{now} since %{source} -- expected if you added media, worth a look if you didn't."
  deploy_prev_outcome: "ℹ️  Previous deploy (%{at}, %{backend}) ended as '%{outcome}': uploaded %{uploaded}, failed %{failed}. This run re-diffs against the manifest; the guards apply as normal."
  deploy_unfinished_streak: "⚠️  Deploys in a row that have not finished: %{count} -- something is being refused every time (an oversized file, credentials, the target). The guards are on; the failures below say what."
  deploy_no_growth_reference: "ℹ️  Nothing to measure growth against yet -- that guard stands down for this one run (the drop guard still measures against the manifest)."
  deploy_selection: "Files selected: %{files}, %{bytes} in the build, new or changed: %{changed}, unchanged (skipped): %{unchanged}"
  deploy_orphans_delete: "Orphans to delete: %{count}%{why}"
  deploy_orphans_kept: "⚠️  Orphaned files on the target: %{count} -- delete them with --prune"
  deploy_orphans_why_prune: " (--prune)"
  deploy_orphans_why_snapshot: " (snapshot deploy)"
  deploy_orphans_why_only: " (named in --only, no longer in the build)"
  deploy_orphans_no_single_delete: "⚠️  %{names}: no longer in the build, but %{backend} cannot delete single files -- run ./scripts/deploy-web.sh --prune to take them off the target."
