# ./blog.sh doctor -- reads the configuration on disk and reports what is
# wrong with it (lib/doctor.rb). Every "fix" line has to be actionable on
# its own: it is read by someone who does not know which file the setting
# lives in, let alone which key.
doctor:
  tag_icons_ok: "Tag icons: %{count}, all of them drawable."
  tag_icon_shape: "An entry under `tag_icons` is not a mapping -- each one needs a `tag` and either an `icon` name or an `icon_svg`."
  tag_icon_no_tag: "An entry under `tag_icons` has no `tag`, so it belongs to nothing and draws nothing."
  tag_icon_unknown: "The tag \"%{tag}\" asks for the icon \"%{icon}\", which this engine does not have. The names it knows: %{known}. For anything else, give it an `icon_svg` of your own."
  tag_icon_not_svg: "The `icon_svg` of the tag \"%{tag}\" holds no <svg> element, so nothing will be drawn."
  tag_icon_scale: "The `icon_svg` of the tag \"%{tag}\" is not drawn on the 24-unit grid the other icons use (`viewBox=\"0 0 24 24\"`), so it will sit crooked in a date badge."
  trash_holds: "The trash holds %{count} post(s), %{size}. They are still restorable; `./blog.sh empty trash` deletes them for good."
  heading: "Checking this install"
  running_online: "Checking hosts and tokens too (--online)"
  summary: "%{errors} problem(s), %{warnings} worth a look, %{oks} fine."
  summary_clean: "No problems. %{oks} check(s) passed."
  hint_online: "Add --online to also check that the feeds, the analytics script and the access token still answer."

  env_ok: "env.sh is there and only you can read it."
  env_missing: "There is no env.sh, so no tokens and no deploy target are configured."
  env_missing_fix: "Run ./setup.sh, or copy it by hand: cp env.sh.example env.sh && chmod 600 env.sh"
  env_mode: "env.sh is mode %{mode} -- other users on this machine can read your tokens."
  env_mode_fix: "chmod 600 env.sh"

  site_yml_ok: "config/site.yml parses."
  site_yml_missing: "There is no config/site.yml, so nothing can be built."
  site_yml_missing_fix: "Run ./setup.sh, or copy the documented template: cp config/site.yml.example config/site.yml"
  site_yml_empty: "config/site.yml is empty, or is not a set of settings."
  site_yml_syntax: "config/site.yml is not valid YAML: %{message}."
  site_yml_unreadable: "config/site.yml exists but cannot be read: %{message}."
  site_yml_unreadable_fix: "Check the file's owner and permissions (ls -l config/site.yml). Usually: chmod 644 config/site.yml — and if the file is owned by root after a wizard ran under sudo, chown it too."
  site_yml_syntax_fix: "Look at line %{line}, column %{column}. Almost always this is indentation (spaces only, never tabs), a missing quote, or a colon inside an unquoted value. If that line looks fine, the cause is elsewhere -- most often a section header commented out with its keys left behind, or a quote left open earlier."

  identity_ok: "The site's identity is filled in."
  key_missing: "%{key} is missing from config/site.yml."
  base_url_missing: "The site has no address -- RSS, the sitemap and every share preview need one."
  base_url_missing_fix: "Set site.base_url in config/site.yml, or SITE_BASE_URL in env.sh."
  base_url_placeholder: "The site's address is still the example's https://example.com."
  base_url_placeholder_fix: "Fine while you are only looking at it locally. Set the real one before you deploy, or every link the site publishes about itself points at example.com."
  base_url_shape: "The site's address (%{value}) is not a URL."
  base_url_shape_fix: "It has to start with http:// or https:// and carry a host name."
  base_url_slash: "The site's address (%{value}) ends with a slash, which produces doubled slashes in generated links."
  base_url_slash_fix: "Drop the trailing slash."
  page_size: "site.page_size is %{value}; it has to be a whole number greater than zero."
  locale_mismatch: "site.locale is %{locale} but the site is written in %{lang} -- every page announces og:locale=\"%{locale}\" to anything that reads it. Deliberate (en_GB under lang en) is fine; otherwise put site.locale in step with site.lang."
  locale_mismatch_fix: "Deliberate is fine -- en_GB under lang en is a real answer. Otherwise put site.locale in step with site.lang; the wizard writes both together."

  placeholders: "Still the example's text: %{keys}."
  placeholders_fix: "Harmless locally, but this is what visitors would read. ./style.sh asks for the bio, the footer and the links."

  lang_unknown: "site.lang is \"%{lang}\", and there is no locales/%{lang}.yml to go with it."
  lang_unknown_fix: "Available: %{available}. To add another, see docs/localization.md."

  timezone_ok: "Timestamps are written in %{zone}."
  timezone_unknown: "site.timezone \"%{zone}\" is not a timezone this machine knows."
  timezone_unknown_fix: "Use an IANA name like Europe/Prague or America/New_York (see /usr/share/zoneinfo), or UTC. A typo here would silently date every post wrong."

  approval_ok: "Comments are moderated -- only replies you favourite are published."
  approval_boolean: "comments.approval is on (or yes), which YAML reads as a boolean, not a mode."
  approval_boolean_fix: "Write the mode by name: comments.approval: fav. (off and no are understood, since they can only mean one thing.)"
  approval_unknown: "Unknown comments.approval %{value} -- the build will refuse it."
  approval_unknown_fix: "The only values are \"fav\" (publish the replies you favourite) and \"off\" (publish all of them)."
  approval_key_unknown: "config/site.yml has a comments: section, but nothing in it that moderation reads (found: %{keys}) -- so every reply is published, unmoderated."
  approval_key_unknown_fix: "The key is comments.approval, and \"fav\" is the mode that publishes only the replies you favourite. If you meant not to moderate, delete the section instead: a key nobody reads is not the same as switching moderation off, and the two look identical until a reply you never approved is on the site."
  approval_no_network: "comments.approval is on, but no network is configured to announce posts on."
  approval_no_network_fix: "Moderation picks from the replies to an announcement. Configure mastodon: or bluesky:, or set comments.approval: off."
  approval_needs_cron: "Moderated comments reach the site only through scripts/refresh-sidebar.sh."
  approval_needs_cron_fix: "Put it in cron (*/30 * * * * /path/to/blog.sh/scripts/refresh-sidebar.sh). Without it the site keeps the comments it last uploaded, and a newly approved one never appears."
  approval_probe_ok: "The token can see which replies you favourited."
  approval_probe_nothing: "Nothing is announced yet, so there was no thread to test the token against."
  approval_probe_blind: "The network answers without saying which replies you favourited -- every thread on the site would come out empty."
  approval_probe_blind_fix: "The Mastodon token needs the read:statuses scope as well as write:statuses -- reissue it under Preferences -> Development. On Bluesky, check BLUESKY_APP_PASSWORD is an app password for the handle in config/site.yml."
  approval_probe_failed: "Could not check whether the token sees your favourites: %{message}"
  no_network: "No comments network configured -- posts are not announced anywhere."
  credentials_no_network: "%{vars} is set in env.sh, but no network section is configured -- so nothing is announced and no comments are read."
  credentials_no_network_fix: "A token with no section to use it usually means the header itself is still commented out: check that %{sections} in config/site.yml is a live line, not a comment, and that its keys sit under it. Delete the credential from env.sh if the site really announces nowhere."
  both_networks: "Both mastodon: and bluesky: are configured, and the build refuses that."
  both_networks_fix: "Comments and the announcement post live on exactly one network. Comment out the section you do not want."
  mastodon_instance_shape: "mastodon.instance is \"%{value}\" -- it takes a host name only, with no https:// and no path."
  mastodon_ok: "Announcing to %{instance}."
  mastodon_token_missing: "mastodon: is configured but MASTODON_ACCESS_TOKEN is empty, so nothing is ever announced."
  mastodon_token_missing_fix: "Create one on the instance under Preferences -> Development -> New application, scope write:statuses, and put it in env.sh."
  toot_length: "mastodon.toot_length is %{value}; it has to be a whole number greater than zero."
  link_length: "mastodon.link_length is %{value}; it has to be a whole number, zero or more -- it is what your server charges for a link (23 on Mastodon)."
  bluesky_ok: "Announcing as %{handle}."
  bluesky_password_missing: "bluesky: is configured but BLUESKY_APP_PASSWORD is empty, so nothing is ever announced."
  bluesky_password_missing_fix: "Settings -> App Passwords on Bluesky. An APP password, never the account password. Put it in env.sh."

  banner_ok: "The banner image is there and its declared size matches the file."
  banner_default: "Still the banner the engine ships with."
  banner_missing: "The banner image %{path} is not there, so every page will show a broken image."
  banner_missing_fix: "Put the file where banner.src points, or change banner.src."
  banner_dimensions: "The banner is declared %{declared} but the file is %{actual}, so the page jumps as it loads."
  banner_dimensions_fix: "Set banner.width to %{width} and banner.height to %{height}."

  colors_ok: "The palette is complete and every value is a colour."
  colors_missing: "The %{mode} palette is missing %{keys}; those fall back to the engine's blue."
  colors_missing_fix: "Either set all seven, or omit the section entirely -- a half-set palette mixes two designs."
  colors_hex: "colors.%{mode}.%{key} is %{value}, which is not a colour."
  colors_hex_fix: "Values look like \"#1da1f2\" or \"#fff\" -- with the quotes, or YAML reads the # as a comment."

  fonts_ok: "Every font file named in the config is in assets/fonts/."
  fonts_missing: "Named in the config but not in assets/fonts/: %{files}."
  fonts_missing_fix: "The site renders in the fallback font, which looks exactly like the config not working. Put the file there, or drop it from fonts.faces."

  extra_css_ok: "Extra stylesheet(s): %{count}, every one a path on this site and present."
  nav_ok: "Menu: %{count} item(s), every one of them pointing at something."
  nav_tag_missing: "The menu item \"%{label}\" points at the tag %{tag}, which no post carries."
  nav_tag_missing_fix: "Its listing is not built, so the item is a 404 in your own menu. Usually the last post with that tag was unpublished or retagged. Fix the tag or drop the item."
  nav_tag_display_form: "The menu item \"%{label}\" points at the tag %{tag}, which is the tag's name rather than the slug its listing is built under."
  nav_tag_display_form_fix: "The posts and the listing are both there; the item just addresses them in the wrong form, and it is a 404 from every page of the site. Write the slug: %{slug}"
  nav_url_missing: "The menu item \"%{label}\" points at %{url}, which this site does not answer at."
  nav_url_missing_fix: "Usually a post that was renamed or deleted after the menu was written. Point it somewhere that exists, or drop it -- an address off this site is left alone here, that is check --online's question."
  nav_asset_missing_fix: "The address names a file under /assets/ that neither the sources nor the built site have. Put the file there, fix the spelling, or drop the item -- it 404s on every page until then."
  nav_url_relative: "The menu item \"%{label}\" points at %{url}, which is not an address but a name read against whatever page it is on."
  nav_url_relative_fix: "From the front page it may even work; from a post it lands beside the post. Write it with the slashes: %{url}"
  extra_css_remote: "site.extra_css names %{value}, which lives on another host."
  extra_css_remote_fix: "Every page carries style-src 'self', so the browser discards it and the site renders undressed -- with no error anywhere you would see one. Copy the file into assets/ and name it /assets/css/<name>.css."
  extra_css_missing: "site.extra_css names %{value}, which is not in the tree."
  extra_css_missing_fix: "The page asks for it, gets a 404 and renders without it, which looks exactly like a stylesheet that does nothing. Put the file there, or drop the line."

  widgets_ok: "%{count} sidebar widget(s), all filled in."
  text_shape: "`%{key}` is not text."
  text_shape_fix: "This one is prose the site shows to a reader -- a line of text (Markdown is fine). Written as a list or a section of settings it renders as nothing at all, and the page quietly loses it."
  map_shape: "`%{key}` is not a section of settings."
  map_shape_fix: "This key holds settings written as `name: value` lines indented under it. A key with nothing under it means none of them, which is allowed."
  widget_unknown: "The sidebar has no card called %{name}."
  widget_unknown_fix: "The cards are toots, pixelfed, commits, bluesky and rss. A name outside that list is drawn by nothing -- and if it is the only widget written down, the column disappears from every page."
  nav_item_shape: "Menu item %{index} has no label, or nowhere to go."
  nav_item_shape_fix: "Each item takes a `label` plus either a `tag` (a tag slug) or a `url`. An item missing either half is skipped rather than drawn empty."
  sidebar_ok: "Sidebar: %{count} card(s)."
  sidebar_empty: "The sidebar is on, but nothing would stand in it."
  sidebar_empty_fix: "Since 1.4 the column is only drawn when it has something to hold, so every page is built full width. Write an about text or a widget, or say so on purpose with layout.sidebar: false."
  list_shape: "`%{key}` is not a list."
  list_shape_fix: "A list is written as lines starting with \"- \" under the key. A key with nothing under it means none of them, which is allowed."
  widget_shape: "The %{name} widget is not a set of settings."
  widget_shape_fix: "A widget is a set of settings written under its name -- heading, and whatever else that card needs. A list or a bare value there is drawn by nothing."
  widget_incomplete: "The %{name} widget has no %{key}, so it can never show anything."
  widget_account_id: "The toots widget wants the account's API id and has %{value}."
  widget_toots_instance: "The toots widget has no instance -- neither widgets.toots.instance nor mastodon.instance."
  widget_toots_instance_fix: "Set mastodon.instance (e.g. mastodon.social), or widgets.toots.instance if the widget should show a different account."
  widget_account_id_fix: "Not the @handle -- the id: a number on Mastodon, a 26-character ULID on GoToSocial. Open https://instance/api/v1/accounts/lookup?acct=you and copy \"id\"; ./setup.sh looks it up for you."
  widget_username: "The commits widget's `username` is not a username: %{value}."
  widget_username_fix: "Just the account name as the forge writes it -- letters, digits, dot, dash, underscore. Not an @handle, not a profile URL."
  widget_instance_repo: "The commits widget's `instance` has a path in it: %{value}."
  widget_instance_repo_fix: "The widget wants the server itself. A forge that really does live under a path is fine -- but so is a profile or a repository address, and they look the same from here. Open <instance>/api/v1/version in a browser: a forge answers with a version, anything else does not."
  widget_instance: "The commits widget's `instance` is not a server address: %{value}."
  widget_instance_fix: "Write the server itself, scheme and host only -- \"https://codeberg.org\", \"https://git.example.org\" -- not a handle, a repository or a bare host name. Leave the key out entirely for GitHub."
  widget_heading: "The %{name} widget has no heading, so it appears without a title."
  widget_limit: "The %{name} widget's limit is %{value}; it has to be a whole number greater than zero."

  slots_ok: "%{count} publishing slot(s)."
  slots_shape: "publishing.slots has to be a list."
  slots_bad: "Publishing slots that will be ignored: %{values}."
  slots_bad_fix: "The format is \"<day> HH:MM\" -- mon, tue, wed, thu, fri, sat, sun or daily, then a 24-hour time. Full day names do not work."
  scheduler_ok: "The queue has %{count} post(s) waiting and something ran it %{ago} ago."
  scheduler_never: "%{count} post(s) are waiting in the queue, but nothing has ever run it here -- they will not publish on their own."
  scheduler_stale: "Nothing has run the queue for %{ago}, and %{count} post(s) are waiting -- it runs every fifteen minutes when it runs at all."
  scheduler_overdue: "The scheduler is running (last tick %{ago} ago), but %{count} post(s) are past their date and still unpublished."
  scheduler_overdue_fix: "Something fails on those posts on every tick. Run `ruby scripts/publish_scheduled.rb` by hand and read what it says -- it keeps retrying until you fix it."
  deploy_pending: "The site owes a deploy (since %{ago} ago): something was published and the upload did not happen."
  deploy_pending_fix: "Run `./blog.sh rebuild`. With the scheduler cron set up, the next tick settles the debt on its own."
  scheduler_fix: "Schedule scripts/publish-scheduled.sh -- every fifteen minutes is what the wizard's times assume (*/15 * * * * /path/to/blog/scripts/publish-scheduled.sh). On a hosted install the panel's own cron section is the place; check that its path points at THIS blog and not another one."
  age_minutes: "%{count} minute(s)"
  age_hours: "%{count} hour(s)"
  age_days: "%{count} day(s)"

  media_location_clean: "No photo in the archive carries the place it was taken."
  media_location: "%{count} photo(s) in the archive still carry the place they were taken -- saved before the engine started removing it, and the site shows what the archive holds."
  media_location_fix: "./blog.sh doctor --strip-location removes it. New photos are already handled; set media.strip_location to false in config/site.yml if you want the coordinates kept."
  media_location_no_dir: "There is no media.nosync directory yet, so there is nothing to clean."
  media_location_stripping: "Removing the location from %{count} photo(s)…"
  media_location_stripped: "Cleaned %{count} photo(s)."
  media_location_unwritable: "%{count} could not be rewritten -- check the file permissions and run this again."
  media_location_redeploy: "Each rewritten photo has a new checksum, so the next deploy uploads it again. Run ./blog.sh rebuild when you're ready."
  backend_unset: "No deploy target chosen, so the site is built locally and goes nowhere."
  backend_unset_fix: "That is a fine place to start -- ./blog.sh preview shows the build. Run ./setup.sh when you want it online."
  backend_ok: "Deploying with the %{name} backend."
  backend_unknown: "DEPLOY_BACKEND is \"%{name}\", which is not a backend this engine has."
  backend_unknown_fix: "Known backends: %{known}."
  backend_incomplete: "The %{name} deploy backend is missing %{values}, so deploys upload nothing."
  backend_incomplete_fix: "Deploys say so and exit cleanly, which is what a local-only install wants -- set the values in env.sh when you want the site online."

  widget_label: "the %{name} widget's feed"
  analytics_label: "the analytics script"
  online_ok: "%{label} answers."
  online_failed: "%{label} (%{url}) did not answer: %{message}."
  token_ok: "The access token works -- %{handle}."
  token_invalid: "%{instance} rejected the access token."
  token_invalid_fix: "Nothing has been announced since it stopped working, and nothing will be until it is replaced. Create a new one and put it in env.sh."
  token_invalid_bluesky_fix: "Make a fresh app password in Bluesky (Settings -> Privacy and security -> App passwords) and put it in env.sh as BLUESKY_APP_PASSWORD."
  token_unchecked: "Could not check the token against %{instance} (%{code})."
  thread_public: "%{instance} serves the thread without a login -- a visitor's browser reads the live comments itself."
  thread_closed: "%{instance} does not let a visitor's browser read the thread (it answers 401/403)."
  thread_closed_fix: "Live comments cannot work here -- a token cannot be put in a browser. Turn on `comments.approval: fav` in config/site.yml: the thread is then read by the cron with a token (scope read:statuses) and only the replies you starred reach the site. GoToSocial works this way, and so does a Mastodon in secure mode."
  thread_unchecked: "%{instance}: could not verify whether it serves the thread without a login (%{code})."

# ./setup.sh -- the core setup wizard (scripts/setup.rb). Prompts are a
# label, a hint under it, and the pre-filled value. Hints explain what
# the setting does and, where the shape of an answer is not obvious, end
# with an example -- on a fresh install the "current value" is only the
# template's filler, so it cannot show the shape. Whether anybody
# actually chose the value is what the "Now:" vs. "Suggested:" line says
# (wizard.prompt_with_current / prompt_with_suggestion).
check:
  progress_online: "Asking the web: %{done}/%{total}"
  running_online: "Also checking links that leave this site -- this takes a while."
  online_ok: "All %{count} outside link(s) still answer."
  link_gone: "%{slug}: %{url} is gone (%{reason})."
  link_gone_fix: "Only hosts that no longer resolve and pages answering 404/410 are reported -- a timeout or a 5xx is \"not right now\" and is left alone. Fix the link, drop it, or point it at the Wayback Machine."
  reason_no_host: "the host does not exist"
  repair_nothing: "Nothing to repair -- the archive is sound."
  repair_heading: "Checking this archive, then offering a repair for each thing found"
  repair_no_offer: "No repair to offer here: this one is yours to decide."
  repair_no_offer_draft: "The only post of that name is still a draft, and a draft has no address on the site yet -- publish it and this link repairs itself."
  repair_no_offer_duplicate: "Two posts carry that slug, in different years, so it names neither of them. This one needs a person."
  repair_add_redirect: "Write %{origin} into the redirect_from of %{slug} (%{to}) -- one added line, every link to the old address answered, including the ones from outside."
  repair_rewrite_link: "Rewrite the link in %{slug}: %{from} -> %{to}"
  repair_decode_entities: "Rewrite the entity codes in %{slug} as the characters they stand for: &amp; to &, &lt; to <. The previous version of the post is kept in its history."
  repair_rename_media_ref: "Write the name the directory actually uses into %{slug}: %{from} -> %{to} (the file itself is not touched)."
  repair_trash: "Move %{path} to the trash (restorable, never deleted)."
  repair_prompt: "Apply? [a] apply  [s] skip  [q] stop"
  repair_applied: "Done."
  repair_failed: "Could not be applied -- nothing was changed."
  repair_busy: "Something else is writing to this installation right now, so nothing was changed. Try again in a moment."
  repair_summary_failed: "Refused or failed: %{count}. Nothing was changed for those."
  repair_summary: "Applied: %{applied}, skipped: %{skipped}, nothing offered: %{no_offer}."
  repair_rebuild: "Run ./blog.sh rebuild to put the changes on the site."
  unknown_option: "Unknown option: %{option}. check takes --online, --json and --repair, nothing else."
  heading: "Checking this archive"
  progress: "Reading posts: %{done}/%{total}"
  no_posts: "There are no posts to check yet."
  all_clear: "Nothing wrong inside the archive: %{posts} post(s), with media, links and redirects all checking out."
  series_similar: "The series \"%{a}\" (%{count_a} post(s)) and \"%{b}\" (%{count_b} post(s)) differ by only a few characters -- a typo?"
  series_similar_fix: "If they are one series, unify the `series:` spelling across the posts -- different spellings found two series and split the parts between them."
  media_missing: "%{slug}: the file %{file} is missing from its media directory."
  media_unusable: "Post '%{slug}': %{file} is there but no reader can use it -- %{cause}."
  media_cause_dir: "it is a folder, not a file"
  media_cause_unreadable: "the read permission is missing"
  media_cause_empty: "it is zero bytes"
  media_cause_broken_link: "it is a link pointing at a file that is not there"
  media_unusable_fix: "An interrupted download, a permission bit or a folder under the picture's name. Put a real copy of the file there; the page shows a broken picture until then."
  media_missing_fix: "The post asks for it and the page renders a hole. Usually an import whose download failed -- put the file there, or edit the post to drop it."
  image_degenerate: "%{slug}: the image %{file} is %{width}x%{height} and will not be rendered at all."
  image_degenerate_fix: "Anything 1px or smaller is treated as a tracking pixel and dropped WITH its caption, so the page silently loses both. Replace the image or remove the block."
  link_dead: "%{slug}: links to %{url}, which nothing on this site answers at."
  link_dead_fix: "Usually a permalink left over from an import, or a slug renamed before renames kept a redirect. Fix the link, or give the target post a redirect_from entry."
  link_relative: "%{slug}: links to %{url}, which is read relative to the post itself, not to the site."
  link_relative_fix: "Three shapes, three different fixes: a link to another post on this site (rewrite it as /posts/<year>/<slug>/), a bare host name missing nothing but its protocol (the address is right -- add https://), and an absolute URL with a stray character in front of it (\" or :). All three resolve inside the post's own URL, and a query string a static host ignores answers 200 with the very page the reader is standing on -- so nothing breaks and nobody arrives. Whether the target still answers is a question for check --online."
  media_orphan: "No post owns the media directory %{dir}."
  media_orphan_fix: "Left over from a deleted or renamed post, or an import that ran twice. Nothing links to it; delete it yourself once you have looked."
  media_misnamed: "%{slug}: names the file %{file}, but its media directory holds it as %{actual}."
  media_misnamed_form: "%{slug}: names the file %{file} in a different unicode form than the one its media directory holds."
  media_misnamed_fix: "The bytes are fine; only the spelling in the post differs. On a filesystem that ignores case (macOS) the page still renders and this is housekeeping; on one that does not (most servers) the picture is already missing. `./blog.sh check --repair` offers to write the name the directory actually uses."
  media_misnamed_both_fix: "This post already refers to the correct spelling somewhere else, so no rename is offered: writing it here too would leave two blocks pointing at one picture and the other one lost. Look at the post and decide which block should carry which file."
  media_stray: "Post %{slug} no longer names the file %{file} in its media directory."
  media_stray_fix: "Left behind by a picture the source dropped or renamed between imports. The post does not reference it; delete it yourself once you have looked."
  address_duplicate: "%{count} posts would be served at /posts/%{year}/%{slug}/."
  post_unknown_type: "The post \"%{slug}\" asks for `type: %{type}`, which this engine does not know -- it is stored and read by nobody, so the post gets no listing, no menu entry and no icon of its own."
  post_unknown_type_fix: "The eight it knows are text, quote, chat, image, video, audio, link and document. For a section of your own, use a TAG and name it in `nav:` -- that gives a listing with its own pagination, a menu entry and an RSS feed, which a content type would not."
  page_reserved_slug: "The page \"%{slug}\" would sit at an address the engine writes itself (/%{slug}/), so the build refuses to write it -- the page is not on the site."
  page_reserved_slug_fix: "Rename the page to something else. The build says so on the terminal at every rebuild, but a scrolled-past warning is how a page stays missing for months."
  post_unreadable: "%{file} could not be read (%{reason})."
  json_and_repair: "❌ --json and --repair cannot run together: --json is a document about the archive as it stands, --repair changes it. Run `check --repair` first, then `check --json`."
  post_unreadable_fix: "The build refuses to run in this state. Repair the file or move it aside -- while it sits there like this, check knows nothing about it and the site will not build."
  post_content_unreadable: "%{file} has its text in something that is not a list of blocks (%{value})."
  post_bad_slug: "%{file} has a slug that is not a single path segment (%{slug})."
  post_bad_slug_fix: "A slug becomes the post's address, one folder deep. A slash or a `..` in it makes the build write outside where it should, or stop. Rename the post: ./blog.sh props <slug> -> [r]."
  post_entities: "%{slug}: the text carries HTML entities (%{entities}) instead of the characters they stand for."
  post_entities_fix: "Comes from an archive that escaped them (Twitter does this to &, < and >); the engine has decoded them since 1.4, older imports did not. `check --repair` offers to convert them. If you wrote the entities on purpose, leave them."
  parked_leftover: "An interrupted queue move left %{file} parked under a working name."
  parked_leftover_fix: "The file (or folder) is a post, its media or its edit history, one rename away from where it belongs: strip the leading dot and the .queue-move suffix to put it back."
  parked_leftover_fix_stale: "The same post is in the archive at %{live}, so this is the copy the interrupted move left behind. Compare the two, and delete this leftover once you have confirmed the live one is whole. Do NOT rename it back: the archive would then hold the post twice."
  parked_leftover_fix_blocked: "%{home} is taken by a DIFFERENT post, and this post is nowhere else in the archive -- so this file may be the only copy of it there is. Do not rename it over what is there and do not delete it: compare the two, then put this one back under a name that is free (its date decides the year)."
  post_content_unreadable_fix: "A post's content is a list, one entry per block. The build ends in an error on anything else. Open it with ./blog.sh edit, or restore an older version with props [v]."
  post_date_unreadable: "%{file} has no date anything can work with (%{value})."
  post_date_unreadable_fix: "The date is what the address and the ordering are made of, so the build ends in an error on it. Write one as 2026-08-22T10:00:00+02:00."
  address_duplicate_fix: "The build refuses to run in this state -- one post would be written over the other and their media mixed. Give one of them another slug (`./blog.sh props` -> address), or a date in another year."
  address_duplicate_page: "%{count} pages would be served at /%{slug}/."
  address_duplicate_page_fix: "A page has no year in its address, so another date will not separate them. The site still builds, but only one of the two is served -- the other stays in the sitemap and in search, leading to somebody else's text. Give one of them another slug (`./blog.sh props` -> address)."
  redirect_collision: "%{origin} is claimed by more than one post: %{slugs}."
  redirect_collision_fix: "Whichever renders last wins and the others' readers land on it. Leave the entry on one post only."
  redirect_from_reserved: "%{slug}: the redirect_from %{entry} will not be served -- its first segment belongs to the site itself."
  redirect_from_reserved_fix: "The build refuses it and says so once, in the middle of a log nobody keeps, so the old address quietly 404s. Point it somewhere outside the site's own namespace (posts, page, tag, type, assets, search, markdown), or take the entry out."
  redirect_from_unusable: "%{slug}: the redirect_from %{entry} will not be served -- the build can make no directory of that shape."
  redirect_from_unusable_fix: "A query, a fragment, a . or .. segment, or a segment too long for a filename. Expected a site-root path like \"/old-post/\". Correct it, or take the entry out."
  and_more: "...and %{count} more of the same kind, not listed."
  summary: "%{errors} problem(s), %{warnings} thing(s) worth a look."
  summary_clean: "The archive is sound."

stats:
  # Refusals raised by lib/post_stats.rb on the cron path. They reach a
  # person twice -- as a line in the cron mail, and interpolated into what
  # doctor --online says about the token -- so on a site that is not English
  # they were half of a sentence in the wrong language.
  no_mastodon_token: "comments.approval is on but MASTODON_ACCESS_TOKEN is not set -- without it the API never says which replies you favourited."
  no_bluesky_password: "comments.approval is on but BLUESKY_APP_PASSWORD is not set -- without it the API never says which replies you liked."
  blind_answer: "comments.approval is on but the %{network} answer did not say which posts are favourited -- the request was not authenticated, or the token is missing read:statuses. Refusing rather than publishing an empty thread over the comments already approved."
  # Why the fetch and the approval probe could not run at all, for the
  # same reason as the three above: fetch_one quotes them into a warning
  # naming the post, and doctor drops them whole into
  # approval_probe_failed's %{message}. One line each -- doctor quotes the
  # first line and nothing after it.
  probe_unreadable_url: "mastodon_url %{url} is not an address this engine can read -- expected https://instance/@user/123 or https://instance/users/user/statuses/123, so no engagement or comments can be fetched for that post."
  probe_foreign_instance: "the newest announcement is on %{instance}, which is not the instance in config/site.yml -- the token is not sent to another server to test it, so favourite visibility cannot be checked from here."
  probe_no_thread: "the announcement %{key} did not come back from the network -- it was deleted, blocked or briefly unreachable, so there was no thread to test the app password against."
  unknown_option: "Unknown option: %{option}. stats takes --json, nothing else."
  no_posts: "There is nothing to count yet."
  heading_archive: "The archive"
  heading_years: "By year"
  heading_types: "What they are"
  heading_words: "Words"
  heading_tags: "Tags"
  heading_media: "Media"
  heading_sources: "Where it came from"
  archive_line: "%{total} post(s): %{published} published, %{drafts} draft(s), %{scheduled} scheduled, %{pages} page(s)"
  span_line: "%{first} - %{last}, which is %{days} day(s)"
  busiest_line: "the busiest year was %{year} (%{count} post(s))"
  words_line: "%{total} word(s) in all, %{mean} per post on average, %{median} in the middle"
  longest_line: "longest: %{slug} (%{words} words)"
  reading_line: "reading the whole archive takes %{hours} hour(s)"
  reading_line_minutes: "reading the whole archive takes %{minutes} minute(s)"
  media_none: "no media at all"
  tags_line: "%{unique} different, %{per_post} per post"
  media_line: "%{files} file(s), %{size}, across %{posts} post(s)"
  media_referenced_line: "%{referenced} file(s) the posts ask for, across %{posts} post(s) -- media.nosync is not here"

export:
  heading: "Writing this archive out to %{path}"
  progress: "Writing posts: %{done}/%{total}"
  unknown_option: "Unknown option: %{option}. export takes a directory, --no-drafts, --dry-run and --force."
  target_not_empty: "%{path} is not empty."
  target_not_empty_fix: "Give an empty directory, or repeat with --force to write alongside what is already there. Nothing is deleted either way."
  dry_run_notice: "Dry run: everything is counted, nothing is written."
  no_drafts_notice: "Drafts are staying home -- only published posts and pages are going out."
  no_posts: "There is nothing to export yet."
  summary: "Written to %{path}: %{posts} post(s), %{drafts} draft(s), %{pages} page(s), and %{media} media file(s) (%{size})."
  summary_dry: "Would write to %{path}: %{posts} post(s), %{drafts} draft(s), %{pages} page(s), and %{media} media file(s) (%{size})."
  fallback_note: "%{count} block(s) markdown has no syntax for were written as HTML: %{kinds}. Any engine that passes HTML through renders them, and this engine reads them back whole -- each one carries its own definition in a comment above it, which everybody else ignores."
  collisions: "%{count} file(s) were renamed so they would not overwrite each other -- two posts asked for the same filename."
  next_steps: "The layout is Jekyll's: _posts/, _drafts/, pages at the root, media under assets/. Hugo, Eleventy and Astro read it with a line of config; ./import.sh reads it as it stands."

setup:
  intro: "This asks for the settings a site needs to work, checks the answers as it goes, and writes them into config/site.yml and env.sh."
  intro_skip: "Every question can be skipped -- Enter takes the value pre-filled under it. Nothing is written until you have seen all the changes together and said yes."
  intro_expert: "(Rather edit YAML yourself? The wizard only fills in config/site.yml, whose commented template is config/site.yml.example.)"
  config_unreadable: "❌ %{path} could not be read: %{error}"
  network_unchanged: "Nothing given, so nothing changed -- the site keeps the comments network it had."
  config_unreadable_stop: "Nothing was changed. Every question here offers what the config already says and Enter keeps it -- with the file unreadable there is nothing to keep, and answering would have blanked what is in it. Put the file right (`./blog.sh doctor` names the line) and run this again."

  section_identity: "Who the site is"
  section_address: "Where the site lives"
  section_network: "Where the comments live"
  section_deploy: "Where the site is published"

  q_title: "Full site title"
  h_title: "Shown in the browser tab and the basis of every page's title. E.g.: The Blue Notebook -- Petra's notes."
  q_short_name: "Short name"
  h_short_name: "A shortened form of the title for tight spots: the heading over the banner image and listing titles (\"Tag: garden -- Blue Notebook\"). E.g. just: Blue Notebook."
  q_description: "One-sentence description"
  h_description: "What the site is about. Shown on the banner, in link-share previews and in RSS readers. Plain text, no HTML -- e.g.: Writing about the garden, books and whatever makes me smile."
  q_author: "Author"
  h_author: "Your name or nickname, as it should appear in the RSS feed and the page metadata."
  q_timezone: "Timezone"
  h_timezone: "Publish times are calculated in this zone. An IANA name like Europe/Prague. Mind servers: the machine is often on UTC, but this should be the zone you live in."
  e_timezone: "This machine does not know a zone called \"%{zone}\". Zones are named Continent/City, in English -- Europe/Prague, not Praha or CEST; the full list is in /usr/share/zoneinfo."

  q_base_url: "Site address"
  h_base_url: "The address the site will be seen at, e.g. https://mysite.com -- no trailing slash. RSS, the sitemap and share previews are built from it; written to config/site.yml and env.sh at once."
