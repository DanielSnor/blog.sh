# scripts/manage_post.rb (the ./blog.sh authoring CLI/wizard) and its
# frontmatter-editor hint text. cancel_word is compared against user input
# (downcased) -- if you translate it, users must type the translated word to
# cancel a wait loop.
cli:
  cancel_word: "cancel"
  confirm_word: "yes"
  missing_images_wait: "Missing %{count} image(s), waiting for you to upload them to incoming/:"
  missing_images_prompt: "Press Enter once uploaded (or type \"%{cancel_word}\" to abort): "
  missing_images_eof: "No input left to read (stdin is closed), so the missing files can't arrive. Nothing was saved.\n\n"
  cancelled_nothing_saved: "Cancelled, nothing was saved.\n\n"
  unreadable_post: "⚠️  Skipping unreadable post file %{path}: %{error}"
  editor_buffer_kept: "Your text was not lost -- it is in %{path}. Move it somewhere safe before the next add/edit, which overwrites that file."
  image_dimensions_unknown: "⚠️  %{file}: the image size could not be read, so the page cannot reserve space for it and may jump while loading. PNG, JPEG, GIF and WebP are always read."
  image_heic_hint: "   HEIC displays only in Safari -- convert it first: sips -s format jpeg FILE --out FILE.jpg (macOS), heif-convert FILE FILE.jpg (Linux)."
  post_changed_while_editing: "❌ '%{slug}' changed on disk while you were editing it (the scheduled-publish cron publishes on its own). Nothing was saved, so nothing of that change was lost -- reopen the post and redo your edit on the current version."
  unknown_frontmatter_key: "❌ Unknown key in the header: %{keys}. I know: %{known}. A typo here would be silently dropped on save, so nothing was written -- your text is kept, see below."
  heic_refused: "❌ %{files}: HEIC displays only in Safari -- other browsers would show a broken image. Nothing was saved and the file stays where it is. Convert it first (%{command}), or set media.convert_heic: true in config/site.yml and the engine will convert it for you."
  heic_no_tool: "❌ %{files}: media.convert_heic is on, but no converter was found (tried sips, heif-convert, heif-dec, magick/convert, vips). Nothing was saved. Convert by hand: %{command}"
  heic_converted: "🔄 %{file} → %{target} (HEIC converted via %{tool})."
  heic_convert_failed: "❌ %{file}: HEIC conversion via %{tool} failed -- nothing was saved and the file stays where it is. Convert by hand: %{command}"
  media_too_large: "❌ %{files}: over the %{limit} per-file limit, which the strictest deploy target refuses -- nothing was saved and the file stays where it is. Shrink it, or leave it out of the post and link to it instead."
  media_large: "⚠️  %{files}: close to the %{limit} per-file limit. Saved -- but every reader pays for those bytes, so consider shrinking it."

  double_frontmatter_error: |
    ❌ There's a second frontmatter header in the text.

    It looks like you pasted text that already had its own --- lines under
    the header that was already there. Only the first one is processed, so
    the post would end up without a title and get a slug derived from the
    first few words of the text instead.

    Keep only one header: either delete the empty one at the top, or remove
    the --- lines from the pasted text and copy its values into the one above.

  frontmatter_hint: |
    <!--
    GUIDE -- this block and lines starting with // are removed on save, they never end up in the post.
    (So write your own notes with //, not # -- hashes are reserved for headings.)

    FRONTMATTER (between --- and ---):
      title  heading (optional)
      tags   comma-separated tags, e.g: nature, hike, city
      type   post type -- text / quote / chat / image / video / audio / link
             (optional -- leave it blank and the type is inferred from the
             post's content)

    Publish date isn't set here -- [p]ublish uses the moment you publish,
    [s]chedule asks for a future date/time when you pick it. To backdate,
    type a date: line into the header yourself -- publish will keep it.

    CONTENT goes under the second ---. For formatting syntax:

      Markdown Cheat Sheet -- %{cheat_sheet_url}
    -->

