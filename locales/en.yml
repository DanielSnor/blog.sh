  header_mode: "Mode: %{mode}"
  usage: |
    usage:
      ./blog.sh add                  creates a draft, shows a preview and asks what's next
      ./blog.sh edit [<slug>]        edits a post; without a slug, offers the last %{recent_count} posts to edit
      ./blog.sh props [<slug>]       shows a post's state and its actions (publish, unpublish, rename the slug, delete...)
      ./blog.sh publish [<slug>]     shows a draft's preview and asks what's next (without a slug, offers drafts in progress)
      ./blog.sh schedule [<slug>]    asks for a date and schedules the draft for automatic publishing then; run again to cancel
      ./blog.sh queue                the scheduled-post queue -- reorder, publish now, return a post to the drafts
      ./blog.sh unpublish [<slug>]   moves a published post back to draft, deletes its toot too (without a slug, offers published posts)
      ./blog.sh delete [<slug>]      deletes a post to trash; without a slug, offers the last %{recent_count} posts to delete
      ./blog.sh restore [<slug>]     restores a post from trash; without a slug, offers what's in trash
      ./blog.sh toot [<slug>]        (re-)sends the comment toot (Mastodon sites); without a slug, offers the last %{recent_count} posts
      ./blog.sh bluesky [<slug>]     (re-)sends the Bluesky announcement (Bluesky sites); same rules as toot
      ./blog.sh rebuild              rebuilds and deploys the whole site, not tied to a specific post
      ./blog.sh preview [<port>]     serves public.nosync locally (default port 8000)
      ./blog.sh list [--type=image] [--tag=foo] [--drafts]
                                     prints the posts one per line, newest first -- plain text for pipes and scripts
      ./blog.sh browse [--type=image] [--tag=foo] [--drafts]
                                     walks the archive on screen: filters, search, preview, Enter opens the post
      ./blog.sh doctor [--online] [--strip-location]
                                     reads the configuration and says what is wrong with it
      ./blog.sh check                walks the archive and says what is broken in it
      ./blog.sh export [<dir>] [--no-drafts] [--dry-run] [--force]
                                     writes the whole archive out as a tree of markdown files (default tmp/export)
      ./blog.sh stats [--json]       counts the archive -- posts, years, words, tags, media, where it came from
      ./blog.sh help                 shows this help
      ./blog.sh version              prints the engine version
      ./blog.sh                      launches the interactive wizard

