  description: "Posts of type %{label} on %{author}'s personal site."

index:
  empty: "No posts of this type yet."

archive:
  # The archive index: /archive/ is the map of years, /archive/<year>/ is
  # that year's posts. Months are written as numbers, the way this site
  # writes dates everywhere else.
  title: "Archive"
  description: "Every post on %{site_title}, by year and month."
  year_title: "Archive %{year}"
  year_description: "Posts from %{year} on %{site_title}."
  back: "← Back to the years"
tags:
  # The tag index at /tag/. Sorted by the folded name rather than by bytes,
  # or every accented tag would land after z.
  title: "Tags"
  description: "Every tag on %{site_title}."
  sort_alpha: "A to Z"
  sort_count: "Most used"
search:
  # Doubles as the page's own heading when no query has been typed yet.
  kind: "Search"
  tagline: "Searches across all post types — accent-insensitive."
  tip: "Tip: more than one word means all must match;<br>put an exact phrase in quotes (“…”);<br>exclude a word with a minus (-word)."
  prompt: "Type a query."
  page_title: "Search – %{site_title}"
  page_description: "Full-text search across posts, accent-insensitive."

not_found:
  heading: "Nothing here"
  body: "This address does not point at anything on this site -- it may have been mistyped, or it may have been something that has since moved. The menu above and the search box are the way on."
  page_title: "Nothing here – %{site_title}"
  page_description: "The page this address points at does not exist."

markdown_page:
  default_title: "Markdown"
  description: "Guide to the syntax this blog uses for writing posts."

ui:
  site_nav_label: "Site"
  scroll_top: "Up"
  # Label for the appearance toggle. Read twice: the layout puts it on the
  # page, and assets/js/theme-toggle.js rewrites it on every click -- which is
  # why it also travels through window.BLOG_I18N (client_i18n_json in
  # build/build_blog.rb).
  theme_auto: "Appearance: follow system"
  theme_light: "Appearance: light"
  theme_dark: "Appearance: dark"

# Consumed client-side via window.BLOG_I18N (see client_i18n_json in
# build/build_blog.rb and templates/layout.html.erb) -- assets/js/*.js can't
