  q_description: "Popis jednou větou"
  h_description: "O čem web je. Vypisuje se na hlavičce webu, v náhledech při sdílení odkazu a ve čtečkách RSS. Prostý text bez HTML — třeba: Píšu o zahradě, knihách a všem, co mi udělá radost."
  q_author: "Autor"
  h_author: "Tvoje jméno nebo přezdívka, tak jak se má objevit v RSS feedu a v metadatech stránek."
  q_timezone: "Časová zóna"
