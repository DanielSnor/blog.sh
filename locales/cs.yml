  reading_minutes_under: "< 1 min"
  toc_heading: "Na téhle stránce"
  toc_label: "Obsah"
  series_part: "Díl %{number} ze %{total} — %{name}"
  series_draft_joins: "Série %{name} — publikovaných dílů: %{count}, po publikaci díl %{number}."
  series_draft_new: "Žádný publikovaný post zatím sérii „%{name}“ nenese — překlep, nebo první díl?"
  series_previous: "← %{title}"
  series_next: "%{title} →"
  comments_heading: "Komentáře"
  back_to_list: "← zpět na výpis"
  read_more: "Číst dál"
  video_unavailable: "[video nedostupné]"
  audio_unavailable: "[audio není k dispozici]"
