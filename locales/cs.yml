  token_kept_rejected: "Uložím ho, ale dokud ho nevyměníš, nic se neoznámí. Vytvoř nový a spusť ./setup.sh znovu."

  q_toots_widget: "Ukázat poslední tooty v postranním panelu? ID účtu (%{id}) máme rovnou tady, takže to nic nestojí. [a/N] "
