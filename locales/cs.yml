  newer: "← Novější"
  older: "Starší →"
  latest: "nejnovější"
  page: "strana %{number}"

tag:
  feed_title: "%{name} – %{site_title}"
  # V nadpisu výpisu je vidět samotný štítek; tohle je slovo, které říká,
  # o jaký výpis jde -- zůstává pro odečítače obrazovky a ve výchozím
  # vzhledu se skrývá (viz .listing-heading__kind v site.css).
  kind: "Štítek"
  title: "Štítek: %{name} – %{short_name}"
  description: "Příspěvky se štítkem %{name} na osobním webu %{author}."

series:
  kind: "Série"
  title: "%{name} – %{short_name}"
  description: "Série %{name} na osobním webu, kde %{author} píše — v pořadí ke čtení."

type:
  text: "Text"
  quote: "Citáty"
  chat: "Chat"
  image: "Obrázky"
  video: "Video"
  audio: "Audio"
  link: "Odkazy"
  document: "Dokumenty"
  title: "%{label} – %{short_name}"
  description: "Příspěvky typu %{label} na osobním webu %{author}."

index:
  empty: "Zatím žádné příspěvky tohoto typu."

archive:
  # Rejstřík archivu: /archive/ je mapa let, /archive/<rok>/ je seznam
  # příspěvků toho roku. Měsíce se píšou číslem, protože tak tenhle web
  # píše datum všude jinde.
  title: "Archiv"
  description: "Všechny příspěvky na %{site_title} podle let a měsíců."
  year_title: "Archiv %{year}"
  year_description: "Příspěvky z roku %{year} na %{site_title}."
  back: "← Zpět na přehled let"
tags:
  # Rozcestník štítků na /tag/. Řadí se podle složeného názvu, ne podle
  # bajtů — jinak by štítky s diakritikou skončily až za „z".
  title: "Štítky"
  description: "Všechny štítky na %{site_title}."
  sort_alpha: "Abecedně"
  sort_count: "Podle četnosti"
search:
  # Zároveň slouží jako nadpis stránky, dokud není zadaný žádný dotaz.
  kind: "Vyhledávání"
  tagline: "Prohledá všechny typy příspěvků — bez ohledu na diakritiku."
  tip: "Tip: víc slov = musí být všechna;<br>přesnou frázi dej do uvozovek („…“);<br>slovo vyloučíš mínusem (-slovo)."
  prompt: "Zadej dotaz."
  page_title: "Vyhledávání – %{site_title}"
  page_description: "Fulltextové vyhledávání v příspěvcích, bez ohledu na diakritiku."

not_found:
  heading: "Tady nic není"
  body: "Tahle adresa na tomhle webu na nic nemíří — buď je v ní překlep, nebo mířila na něco, co se mezitím přestěhovalo. Cesta dál je menu nahoře a vyhledávací pole."
  page_title: "Tady nic není – %{site_title}"
