poster:
  # Co se autor dozví, když oznámení neodešlo. Je to výsledek něčeho, co
  # právě udělal — stisku [t] nebo publikace — takže to čte člověk, v CLI,
  # ve svém jazyce. Diagnostika pod tím (HTTP kódy, text výjimky) zůstává
  # anglicky: ta je pro toho, kdo se na to má podívat, a přeložený stavový
  # řádek se nikomu nehledá.
  no_mastodon_token_post: "MASTODON_ACCESS_TOKEN není nastavený, toot se neodeslal."
