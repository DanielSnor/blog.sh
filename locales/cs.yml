  e_timezone: "Tenhle stroj zónu „%{zone}“ nezná. Zóny se jmenují Světadíl/Město, anglicky — Europe/Prague, ne Praha ani CEST; úplný seznam je v /usr/share/zoneinfo."

  q_base_url: "Adresa webu"
  h_base_url: "Adresa, na které bude web k vidění, třeba https://mujweb.cz — bez lomítka na konci. Staví se z ní RSS, sitemapa i náhledy při sdílení; zapíše se do config/site.yml i env.sh naráz."
  e_base_url: "Tohle není URL — musí začínat na http:// nebo https:// a obsahovat jméno serveru."
  e_base_url_slash: "Smaž koncové lomítko, jinak budou v generovaných odkazech dvě."

  section_network_intro: "blog.sh nemá vlastní komentáře pod posty. Každý nový post se místo toho oznámí na tvém účtu na sociální síti a odpovědi na to oznámení se ukazují pod postem jako jeho komentáře. Vybíráš tedy síť, kde už účet máš (nebo si ho založíš)."
  q_network: "Která síť ponese komentáře?"
