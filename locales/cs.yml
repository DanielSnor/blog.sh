stats:
  # Odmítnutí, která vyhazuje lib/post_stats.rb na cronové cestě. K člověku
  # se dostanou dvakrát — jako řádek v cronovém mailu a vložená doprostřed
  # věty, kterou o tokenu píše doctor --online. Na webu, který není
  # anglicky, z toho byla půlka věty v cizím jazyce.
  no_mastodon_token: "comments.approval je zapnuté, ale MASTODON_ACCESS_TOKEN není nastavený — bez něj API nikdy neřekne, kterým odpovědím jsi dal hvězdu."
  no_bluesky_password: "comments.approval je zapnuté, ale BLUESKY_APP_PASSWORD není nastavené — bez něj API nikdy neřekne, které odpovědi se ti líbí."
  blind_answer: "comments.approval je zapnuté, ale odpověď ze sítě %{network} neřekla, které posty jsou označené hvězdou — požadavek nebyl přihlášený, nebo tokenu chybí read:statuses. Odmítám to místo toho, abych přes už schválené komentáře zapsal prázdné vlákno."
  # Proč se načtení ani sonda na schvalování nedají provést vůbec, a to ze
  # stejného důvodu jako tři věty nad tím: fetch_one je cituje do varování,
  # které jmenuje post, a doctor je celé vloží do %{message} v
  # approval_probe_failed. Každá na jeden řádek — doctor cituje první řádek
  # a nic za ním.
  probe_unreadable_url: "mastodon_url %{url} není adresa, kterou tenhle engine umí přečíst — čeká se https://instance/@uzivatel/123 nebo https://instance/users/uzivatel/statuses/123, takže se pro ten post nedají načíst ani ohlasy, ani komentáře."
  probe_foreign_instance: "poslední oznámení leží na %{instance}, což není instance z config/site.yml — token se kvůli testu na cizí server neposílá, takže se odtud viditelnost hvězd ověřit nedá."
  probe_no_thread: "oznámení %{key} se ze sítě nevrátilo — je smazané, zablokované nebo chvíli nedostupné, takže nebylo na čem heslo aplikace vyzkoušet."
