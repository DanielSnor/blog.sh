# ./setup.sh — průvodce základním nastavením (scripts/setup.rb). Prompt je
# popisek, pod ním nápověda a předvyplněná hodnota. Nápověda říká, co to
# nastavení dělá, a kde tvar odpovědi není zřejmý, končí příkladem — na
# čerstvé instalaci je „současná hodnota" jen výplň ze šablony, takže tvar
# ukázat neumí. Jestli hodnotu někdo doopravdy nastavil, říká řádek „Teď:"
# vs. „Návrh:" (wizard.prompt_with_current / prompt_with_suggestion).
setup:
  intro: "Zeptám se na nastavení, která web potřebuje k provozu, odpovědi cestou ověřím a zapíšu je do config/site.yml a env.sh."
  intro_skip: "Každou otázku jde přeskočit — Enter vezme hodnotu předvyplněnou pod ní. Nic se nezapíše, dokud všechny změny neuvidíš pohromadě a neřekneš ano."
  intro_expert: "(Kdo si YAML radši edituje sám: průvodce jen vyplňuje config/site.yml, jehož okomentovaná šablona je config/site.yml.example.)"

  section_identity: "Čí ten web je"
  section_address: "Kde web bydlí"
