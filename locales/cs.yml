  # Zbytek toho, co oba posílače řeknou, když je síť odmítne. Každá věta
  # obaluje diagnostiku, která zůstává tak, jak ji napsal server nebo Ruby:
  # %{error} je text výjimky, %{code} stavový kód HTTP, %{body} samotná
  # odpověď. Věta kolem je to, co čte člověk; co je uvnitř, to pošle dál
  # tomu, kdo se na to má podívat.
