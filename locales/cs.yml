  rebuild_prompt: "Znovu sestavit a nasadit web teď? [A/n] "

  header_mode: "Režim: %{mode}"
  usage: |
    usage:
      ./blog.sh add [<soubor>]       založí draft, ukáže náhled a zeptá se, co dál;
                                     se souborem s markdownem se nezeptá na nic a jen zapíše draft,
                                     což je cesta pro telefon, skript nebo zkratku (--json to ohlásí jako data)
      ./blog.sh edit [<slug>]        edituje post, bez slugu nabídne posledních %{recent_count} postů k editaci
      ./blog.sh props [<slug>]       stav postu, jeho vlastnosti (série, štítky, typ, přepínače) a akce nad ním
      ./blog.sh publish [<slug>] [--yes] [--no-announce] [--json]
                                     ukáže náhled draftu a zeptá se, co dál (bez slugu nabídne rozepsané drafty);
                                     --yes publikuje rovnou bez ptaní, --no-announce nechá post mimo Mastodon a Bluesky
      ./blog.sh schedule [<slug>]    zeptá se na datum a naplánuje draft k automatické publikaci v něm; opětovné spuštění plán zruší
      ./blog.sh queue                fronta naplánovaných postů — pořadí, publikace hned, vyřazení zpět do draftů
      ./blog.sh unpublish [<slug>]   vrátí publikovaný post zpátky do draftu, smaže i jeho toot (bez slugu nabídne publikované posty)
      ./blog.sh delete [<slug>]      smaže post do koše, bez slugu nabídne posledních %{recent_count} postů ke smazání
      ./blog.sh restore [<slug>]     obnoví post z koše, bez slugu nabídne obsah koše
      ./blog.sh empty trash          nadobro smaže všechno v koši; napřed řekne kolik toho je
      ./blog.sh empty versions       nechá každému postu poslední verzi a starší smaže
      ./blog.sh toot [<slug>]        (znovu) pošle komentářový toot (weby s Mastodonem), bez slugu nabídne posledních %{recent_count} postů
      ./blog.sh bluesky [<slug>]     (znovu) pošle oznámení na Bluesky (weby s Bluesky), stejná pravidla jako toot
      ./blog.sh rebuild [--full]     znovu sestaví a nasadí celý web, bez vazby na konkrétní post;
                                     --full sestaví znovu každou stránku, ne jen ty změněné
      ./blog.sh preview [<port>]     servíruje public.nosync lokálně (výchozí port 8000)
      ./blog.sh list [--type=image] [--tag=foo] [--drafts]
                                     vypíše posty po řádcích, od nejnovějšího — prostý text do roury nebo skriptu
      ./blog.sh browse [--type=image] [--tag=foo] [--drafts]
                                     projde archiv na obrazovce: filtry, hledání, náhled, Enter otevře post
      ./blog.sh doctor [--online] [--strip-location]
                                     přečte konfiguraci a řekne, co je s ní špatně
      ./blog.sh check [--online] [--json] [--repair]
                                     projde archiv a řekne, co je v něm rozbité;
                                     --json vypíše všechny nálezy jako data, bez stropu;
                                     --repair u každého nálezu nabídne tu jedinou opravu, kterou dovoluje
      ./blog.sh export [<adresář>] [--no-drafts] [--dry-run] [--force]
                                     zapíše celý archiv jako strom markdownových souborů (výchozí tmp/export)
      ./blog.sh stats [--json]       spočítá archiv — posty, roky, slova, štítky, média, odkud to je
      ./blog.sh help                 zobrazí tuhle nápovědu
      ./blog.sh version              vypíše verzi enginu
      ./blog.sh                      spustí interaktivního průvodce

