# ./setup.sh — průvodce základním nastavením (scripts/setup.rb). Prompt je
# popisek, pod ním nápověda a předvyplněná hodnota. Nápověda říká, co to
# nastavení dělá, a kde tvar odpovědi není zřejmý, končí příkladem — na
# čerstvé instalaci je „současná hodnota" jen výplň ze šablony, takže tvar
# ukázat neumí. Jestli hodnotu někdo doopravdy nastavil, říká řádek „Teď:"
# vs. „Návrh:" (wizard.prompt_with_current / prompt_with_suggestion).
