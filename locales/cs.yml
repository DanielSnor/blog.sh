  double_frontmatter_error: |
    ❌ V textu je druhá hlavička.

    Vypadá to, že jsi vložil text i s vlastními řádky mezi --- pod hlavičku,
    která tu už byla. Zpracuje se jen ta první, takže by post zůstal bez
    titulku a dostal by slug odvozený z prvních slov textu.

    Nech jen jednu hlavičku: buď smaž tu prázdnou nahoře, nebo z vloženého
    textu odeber řádky mezi --- a hodnoty přepiš do té horní.

  frontmatter_hint: |
    <!--
    NÁVOD — tenhle blok i řádky začínající // se při uložení smažou, do postu se nedostanou.
    (Poznámku si tedy piš přes //, ne přes # — mřížky jsou vyhrazené pro nadpisy.)

    FRONTMATTER (mezi --- a ---):
      title  nadpis (volitelný)
      tags   tagy oddělené čárkou, např: příroda, procházka, praha
      type   typ postu — text / quote / chat / image / video / audio / link
             (volitelné — necháš-li prázdné, typ se odvodí sám podle
             obsahu postu)

    Datum publikace se tady nenastavuje — [p]ublikovat vezme okamžik
    publikace, [s]chedule se na budoucí datum/čas zeptá při plánování.
    Zpětné datum: dopiš si do hlavičky řádek date: — publish ho respektuje.

    OBSAH píšeš pod druhý ---. Jak na formátování:

      Markdown Cheat Sheet — %{cheat_sheet_url}
    -->

