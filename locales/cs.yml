# locales/cs.yml -- Czech locale. Missing keys fall back to en.yml
# (see lib/i18n.rb), so this file doesn't need to duplicate every key --
# only the ones that should actually read in Czech.

# strftime formáty pro všechna data renderovaná na serveru (datumové odznaky,
# search index, JSON sidebar widgetů, hlášky CLI). Klientský protějšek je
# js.date_locale níže — drž je konzistentní.
thousands_separator: "\u00a0"
decimal_point: ","
date_format: "%-d. %-m. %Y"
date_time_format: "%-d. %-m. %Y %H:%M"

nav:
  all: "Vše"
  text: "Text"
  quotes: "Citáty"
  chat: "Chat"
  images: "Obrázky"
  video: "Video"
  links: "Odkazy"
  audio: "Audio"
  documents: "Dokumenty"
  menu_label: "Menu"
  search_label: "Hledat"
  search_placeholder: "Hledat…"

# Vlastní řeč buildu -- co vypíše na konci a čím zastaví, když archiv
# postavit nejde. Do 1.4 to bylo natvrdo anglicky i na českém webu.
build:
  unreadable_posts: "❌ V content.nosync/posts/ jsou soubory, které nejdou přečíst — build zastaven:"
  duplicate_address: "❌ Dva posty na jedné adrese v content.nosync/posts/ — build zastaven:"
  # Každý počet má svůj popisek — „postů: 1“, ne „1 postů“ — protože I18n
  # v enginu nezná množná čísla a nikdy je znát nebude. Věta, která musí
  # skloňovat, u nějakého čísla vždycky zaskřípe; popisek s dvojtečkou
  # sedí u všech.
  summary: "Postaveno do %{dir} — postů: %{posts}, stránek výpisu: %{pages}, štítkových stránek: %{tags}, k tomu index hledání, RSS a mapa webu"
  drafts: "Rozepsané drafty (jen náhled, v žádném výpisu nejsou): %{count}"
  reused: "Stránek beze změny, nepřestavěny: %{count}"
  full: "Úplný build -- každá stránka vyrenderována a porovnána."
  two_pages: "⚠️  Na adrese /%{slug}/ se servíruje víc postů (%{count}), doopravdy ale jen jeden:"
  two_pages_fix: "   Web se postaví a adresu si nechá ten STARŠÍ; ten druhý zůstane v mapě webu\n   i ve vyhledávání a povede čtenáře na cizí text.\n   Dej jednomu z nich jiný slug (./blog.sh props → adresa)."
  # Co build říká o tom, co postavit odmítl, v pořadí, jak na to naráží.
  # Všechno tohle padá na skutečných archivech — seznamy přesměrování
  # přinese import, zbytek ručně editovaný JSON — a každá hláška
  # pojmenuje post, o který jde, protože build jede dál i bez něj.
  extra_css_offsite: "⚠️  site.extra_css: %{value} není cesta na tomhle webu, takže by ho Content-Security-Policy stránky zahodila — přeskočeno. Zkopíruj soubor do assets/ a pojmenuj ho jako /assets/css/<jméno>.css."
  page_reserved_name: "⚠️  Stránka „%{slug}“ by seděla na adrese, kterou engine sám používá (/%{slug}/) — nepostavená. Přejmenuj ji."
  draft_no_token: "⚠️  Draft „%{slug}“ nemá draft_token — náhled by byl na uhodnutelné adrese, takže se nestaví. Ulož ho znovu přes ./blog.sh edit."
  pinned_more_than_one: "⚠️  Připnutý je víc než jeden post; použije se ten nejnovější (%{slug})."
  tag_too_long: "⚠️  Štítek „%{name}…“ je na adresu výpisové stránky moc dlouhý — na svých postech se ukazuje, ale stránka /tag/ se pro něj nestaví."
  series_too_long: "⚠️  Série %{name} má jméno delší, než unese adresa, takže nedostane stránku výpisu. Všechno ostatní kolem série funguje; když ji chceš, dej sérii kratší jméno."
  page_size_unusable: "⚠️  site.page_size je %{value}, podle čehož se stránkovat nedá — potřebuje to celé číslo větší než nula. Stavím s 10; `./blog.sh doctor` říká o téhle hodnotě totéž."
  archive_span_absurd: "⚠️  Archiv sahá od roku %{from} do %{to} — to skoro jistě není datum, ale překlep. Mapa archivu proto ukáže jen roky, ve kterých něco je; oprav to datum a vrátí se i prázdné roky."
  former_slug_unusable: "⚠️  %{slug}: nepoužitelná položka former_slugs %{entry} — čeká se tvar „rok/slug“."
  former_slug_taken: "⚠️  %{slug}: přesměrování z %{former} přeskočeno — ta adresa je už obsazená (živá stránka, nebo přesměrování dřívějšího postu)."
  redirect_from_unusable: "⚠️  %{slug}: nepoužitelná položka redirect_from %{entry} — čeká se cesta od kořene webu, třeba „/stary-post/“."
  redirect_from_reserved: "⚠️  %{slug}: redirect_from %{entry} přeskočeno — /%{segment}/ patří webu samotnému."
  redirect_from_taken: "⚠️  %{slug}: redirect_from %{origin} přeskočeno — ta adresa je už obsazená (živá stránka, soubor webu, nebo dřívější přesměrování)."
  redirect_from_directory: "⚠️  %{slug}: redirect_from %{origin} přeskočeno — dřívější přesměrování už z té adresy udělalo adresář."
  # Na skutečném archivu nejčastější z nich a poslední, co v buildu ještě
  # zůstávalo natvrdo: post jmenuje obrázek, který ve své složce médií
  # nemá. Každý import, co narazil na mrtvý obrázkový hosting, jich pár
  # zanechá.
  media_missing: "⚠️  %{slug}: jmenuje soubor médií, který ve své složce nemá — %{filename}. Stránka na něj pořád odkazuje, takže ta adresa bude 404, dokud soubor nedodáš."
  name_not_ours: "⚠️  %{path} je jméno, které už nosí jiný soubor — odkaz, nebo symlink, co tam někdo nechal. Zápis by dosáhl na ten druhý soubor, takže jsme na něj nesáhli a tahle stránka nebo fotka na webu není. Přesuň nebo smaž to, co jméno drží, a spusť build znovu."
  media_unplaceable: "⚠️  %{path} se nepodařilo umístit (%{reason}). Stránka na něj dál odkazuje, takže ta adresa zůstane 404, dokud zápis nepůjde."
  prune_failed: "⚠️  %{path} už na web nepatří, ale nešel odstranit (%{reason}). Zůstává, kde je, a deploy ho bude dál publikovat, dokud ho něco drží."
  # Tohle už není věc archivu: taháček chodí s enginem.
  cheat_sheet_missing: "⚠️  %{path} chybí — stránka /markdown/ s taháčkem se nepostaví. Chodí s enginem; nejčastěji za to může nepovedený pull."
  # Konec podpisu buildu, počítaný s popiskem jako všechno nad ním.
  pruned: "Souborů, které už nic negeneruje a byly smazané: %{count}"

post:
