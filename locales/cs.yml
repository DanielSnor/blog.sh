# lib/wizard.rb — co říkají ./setup.sh i ./style.sh: otázka, která jde
# přeskočit, výběr ze seznamu, a ta chvíle na konci, kdy se všechno
# ukáže jako rozdíl a buď zapíše, nebo zahodí.
wizard:
  prompt_with_current: "Teď: %{current}\n> "
  prompt_with_suggestion: "Návrh: %{current}\n> "
  empty_value: "(nenastaveno)"
  current_is: "Teď: %{value}"
  choice_prompt: "Volba: "
  menu_hint: "↑↓ pohyb · Enter vybrat · 1-%{count} rychlá volba · Esc nechat současné"
  interrupted: "Zastaveno. Nic se nezapsalo — konfigurace je přesně taková, jaká byla."
  template_missing: "%{path} tady není a konfigurace se píše vyplňováním téhle šablony — takže není na co se ptát. Se strojem se dodává: obnov ji (git checkout %{path}) a spusť to znovu."
  config_unreadable_file: "%{path} tam je, ale nejde otevřít — %{error}. Nic se nezměnilo. Sprav práva (nebo připoj svazek, na kterém leží) a spusť to znovu."
  nothing_changed: "Nic se nezměnilo — každá odpověď sedla s tím, co už tam bylo."
  q_write: "Zapsat tyhle změny? [a/N] "
  cancelled: "Nic se nezapsalo."
  write_failed: "Výsledek se nenačetl zpátky tak, jak byl zadaný, takže se nic nezměnilo: %{message}"
  write_denied: "Nic se nezapsalo: %{message}."
  write_denied_backup: "Nic se nezapsalo: do %{path} se nedá zapisovat. Záloha (.bak) se dělá dřív než samotný soubor, takže ta po jiném uživateli blokuje zápis stejně spolehlivě jako soubor sám — zkontroluj, komu patří obojí."
  write_denied_dir: "Nic se nezapsalo: do %{path} se nedá zapisovat. Nový text se píše vedle souboru a teprve pak se přesune na místo, takže zapisovat musí jít do ADRESÁŘE, ne jen do souboru — zkontroluj, komu patří."
  section_review: "Co by se změnilo"
  done: "Hotovo — projít a zapsat"
  menu_hint_exit: "↑↓ pohyb · Enter vybrat · 1-%{count} rychlá volba · Esc dokončit"
  written: "✅ Zapsáno %{path}"
  edit_in_editor: "Otevřít v editoru? [a/N] "
  editor_failed: "Editor se nepodařilo otevřít (%{message}), takže tohle zůstalo, jak bylo."

